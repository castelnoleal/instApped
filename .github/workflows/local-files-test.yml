name: Library Folders Acceptance

# Builds a small page that uses window.CastelFiles and checks, on a real Android emulator, that it can write,
# read, list, serve (also to a framed page), download in the background and pick up files pasted into its folder.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-files-test.yml'
      - 'android-template/**'
      - 'scripts/generate-app.py'
      - 'scripts/ci/files-emulator.sh'
      - 'test-inputs/files/**'
  pull_request:
    paths:
      - '.github/workflows/local-files-test.yml'
      - 'android-template/**'
      - 'scripts/generate-app.py'
      - 'scripts/ci/files-emulator.sh'
      - 'test-inputs/files/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'

      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create fixture
        run: |
          set -euo pipefail
          rm -rf files-test generated-app
          mkdir -p files-test
          cp test-inputs/files/library.html files-test/index.html
          cat > files-test/manifest.json <<'JSON'
          {
            "appName": "Library Folders Acceptance",
            "packageName": "com.castel.filestest",
            "versionName": "1.0.0",
            "versionCode": 1,
            "sourceType": "Uploaded HTML",
            "sourceMode": "html",
            "sourceFileName": "index.html",
            "orientation": "portrait",
            "backNavigation": true
          }
          JSON

      - name: Generate acceptance APK
        env:
          BUILD_MANIFEST: files-test/manifest.json
          BUILD_OUTPUT: generated-app
          SOURCE_FILE: files-test/index.html
          ICON_FILE: ''
        run: |
          set -euo pipefail
          python3 scripts/generate-app.py
          # Library folders switch on automatically because the page uses window.CastelFiles.
          grep -F 'LOCAL_FILES = true' generated-app/app/src/main/java/com/castel/filestest/MainActivity.java
          test -f generated-app/app/src/main/java/com/castel/filestest/LocalFiles.java
          if grep -q 'MANAGE_EXTERNAL_STORAGE' generated-app/app/src/main/AndroidManifest.xml; then echo 'library folders must not ask for all-files access'; exit 1; fi

      - name: Build acceptance APK
        run: |
          set -euo pipefail
          gradle -p generated-app lintDebug assembleDebug --no-daemon --stacktrace
          test -s generated-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Runtime library folders acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: '-no-window -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save'
          emulator-boot-timeout: 900
          script: bash scripts/ci/files-emulator.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-folders-acceptance
          retention-days: 7
          if-no-files-found: ignore
          path: |
            files-test/out/
            generated-app/app/build/reports/lint-results-debug.html
