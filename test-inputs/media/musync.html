  <div class="srow"><div><b>Accent color</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${ACCENTS.map(([c, n]) => `<button class="swatch${S.set.accent === c ? ' on' : ''}" style="background:${c}" data-accent="${c}" aria-label="${n}" title="${n}"></button>`).join('')}</div></div>
  <div class="srow"><div><b>Visualizer</b><br><small>Animated bars on the player</small></div><label class="sw"><input type="checkbox" id="vizOn" ${S.set.viz ? 'checked' : ''} aria-label="Visualizer"><i></i></label></div>
  ${NATIVE || CAN_WATCH_FOLDER ? `<div class="srow"><div><b>Find new music automatically</b><br><small>${NATIVE ? 'Scans this device when muSync opens' : 'Rescans your music folder when muSync opens'}</small></div><label class="sw"><input type="checkbox" id="autoScan" ${S.set.autoScan ? 'checked' : ''} aria-label="Find new music automatically"><i></i></label></div>` : ''}
  ${NATIVE ? `<div class="srow"><div><b>Device music</b><br><small>${[...S.tracks.values()].filter(t => t.mid != null).length} songs found${S.hidden.size ? ` · ${S.hidden.size} hidden` : ''}</small></div><div style="display:flex;gap:6px">${S.hidden.size ? '<button class="btn" data-set="unhide">Show hidden</button>' : ''}<button class="btn" data-set="scan">Scan now</button></div></div>` : ''}
  ${CAN_WATCH_FOLDER ? `<div class="srow"><div><b>Music folder</b><br><small id="fldName">${folderName ? esc(folderName) : 'None chosen'}</small></div><div style="display:flex;gap:6px">${folderName ? '<button class="btn" data-set="rescanfolder">Rescan</button>' : ''}<button class="btn" data-set="watch">${folderName ? 'Change' : 'Choose'}</button></div></div>` : ''}
  <div class="srow"><div><b>Listening stats</b><br><small>${S.set.privateSession ? 'Private session is on' : 'Top songs, artists and listening time · on this device only'}</small></div><button class="btn" data-set="stats">Open</button></div>
  <div class="srow"><div><b>Library</b><br><small>${S.tracks.size} songs${usage ? ' · ' + usage : ''}</small></div><div style="display:flex;gap:6px"><button class="btn" data-set="addfiles">Add</button><button class="btn dan" data-set="clear" ${S.tracks.size ? '' : 'disabled'}>Clear</button></div></div>
  ${S.persistOK ? '' : '<div class="srow"><small style="color:#ff4d5e">This device blocks storage, so your library resets when the app closes.</small></div>'}
  <div class="srow" style="display:${MOBILE ? 'none' : 'block'}"><b>Keyboard shortcuts</b><div class="kbd" style="margin-top:8px"><kbd>Space</kbd><span>Play / pause</span><kbd>← →</kbd><span>Seek 5 seconds</span><kbd>Shift + ← →</kbd><span>Previous / next song</span><kbd>↑ ↓</kbd><span>Volume</span><kbd>M</kbd><span>Mute</span><kbd>S</kbd><span>Shuffle</span><kbd>R</kbd><span>Repeat</span><kbd>L</kbd><span>Favorite</span><kbd>/</kbd><span>Search</span></div></div>
  <div class="sgrp">More on MEIOCG</div>
  <div class="links">
    <a href="https://meiocg.org/duelsynapse" target="_blank" rel="noopener">${icon('cards')}Duel Synapse: KodeX</a>
    <a href="https://meiocg.org" target="_blank" rel="noopener">${icon('globe')}meiocg.org</a>
    <a href="https://www.facebook.com/meiocgOfficial" target="_blank" rel="noopener">${icon('link')}Facebook</a>
    <a href="https://youtube.com/@meiocg" target="_blank" rel="noopener">${icon('play')}YouTube</a>
  </div>
  <div class="about"><div class="logo" aria-hidden="true"></div><div><b>muSync</b> · Meta Insider OCG<br><small style="color:var(--fg2)">Version 2.2 · A project of Meta Insider OCG. Works offline; your music never leaves this device.</small></div></div>`, b => {
    b.querySelectorAll('[data-theme-set]').forEach(c => c.onclick = () => { S.set.theme = c.dataset.themeSet; saveSet(); applyTheme(); b.querySelectorAll('[data-theme-set]').forEach(x => x.classList.toggle('on', x === c)); });
    b.querySelectorAll('[data-accent]').forEach(c => c.onclick = () => { S.set.accent = c.dataset.accent; saveSet(); applyTheme(); b.querySelectorAll('[data-accent]').forEach(x => x.classList.toggle('on', x === c)); });
    b.querySelector('#vizOn').onchange = e => { S.set.viz = e.target.checked; saveSet(); };
    b.querySelector('#autoScan')?.addEventListener('change', e => { S.set.autoScan = e.target.checked; saveSet(); });
    b.querySelector('[data-set=scan]')?.addEventListener('click', async () => { await closeTop(); scanDevice(); });
    b.querySelector('[data-set=unhide]')?.addEventListener('click', async () => { S.hidden.clear(); lsSet('pp.hidden', []); await closeTop(); scanDevice(); });
    b.querySelector('[data-set=watch]')?.addEventListener('click', async () => { await closeTop(); watchFolder(); });
    b.querySelector('[data-set=rescanfolder]')?.addEventListener('click', async () => { await closeTop(); if (!(await rescanFolder(true))) toast("Couldn't open the music folder"); });
    b.querySelector('[data-set=stats]').onclick = async () => { await closeTop(); await closeAll(); S.q = ''; $('#q').value = ''; $('#searchBox').classList.remove('has'); S.view = { tab: 'home', detail: { type: 'stats' } }; render(); view.scrollTop = 0; pushDetailHist(); };
    b.querySelector('[data-set=addfiles]').onclick = async () => { await closeTop(); addMenu(); };
    b.querySelector('[data-set=clear]').onclick = async () => { await closeTop(); if (await confirm2('Clear library?', `All ${S.tracks.size} songs, playlists and favorites will be removed from muSync. Files on your device aren't touched.${NATIVE ? ' Songs on this device come back the next time muSync scans (turn off “Find new music automatically” to stop that).' : ''}`, 'Clear')) { await clearLibrary(); } };
  });
}
async function clearLibrary() {
  audio.unload(); if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }
  try { await DB.clear(); } catch (e) { console.warn(e); }
  for (const u of thumbCache.values()) if (u) URL.revokeObjectURL(u); thumbCache.clear();
  S.tracks.clear(); S.mem.clear(); S.favs.clear(); S.playlists = []; S.queue = []; S.orig = []; S.qi = -1; S.cur = null; wantPlay = false;
  S.hidden.clear(); lsSet('pp.hidden', []); artDataCache.clear(); if (NATIVE) try { window.CastelMedia.stop(); } catch {}
  savePl(); saveFavs(); saveSession(); clearSleep(); updateNow(); updatePlayState(); S.view.detail = null; render(); toast('Library cleared');
}
function addMenu() {
  const items = [];
  if (NATIVE) items.push({ label: 'Scan this device for music', icon: 'search', run: () => scanDevice() });
  if (CAN_WATCH_FOLDER) items.push({ label: 'Choose music folder (auto-adds new songs)', icon: 'folder', run: () => watchFolder() });
  items.push({ label: 'Choose files', icon: 'file', run: () => $('#fileIn').click() });
  if (CAN_PICK_FOLDER && !CAN_WATCH_FOLDER) items.push({ label: 'Choose a folder', icon: 'folder', run: () => $('#dirIn').click() });
  menu('Add music', items);
}

/* ================= Events ================= */
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return; if (S.view.detail) { closeAll(); } S.q = ''; $('#q').value = ''; $('#searchBox').classList.remove('has'); S.view = { tab: b.dataset.tab, detail: null }; S.set.tab = b.dataset.tab; saveSet(); render(); view.scrollTop = 0; };
const doSearch = debounce(() => { S.q = $('#q').value; render(); }, 150);
$('#q').oninput = () => { $('#searchBox').classList.toggle('has', !!$('#q').value); doSearch(); };
$('#qClr').onclick = e => { e.preventDefault(); $('#q').value = ''; S.q = ''; $('#searchBox').classList.remove('has'); render(); $('#q').focus(); };
$('#q').onkeydown = e => { if (e.key === 'Escape') { $('#qClr').click(); $('#q').blur(); } if (e.key === 'Enter') $('#q').blur(); };
$('#addBtn').onclick = addMenu; $('#setBtn').onclick = openSettings;
$('#fileIn').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); };
$('#dirIn').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); };

view.addEventListener('click', e => {
  const act = e.target.closest('[data-act]'); const row = e.target.closest('.row[data-id]');
  if (act && act.dataset.act === 'menu' && row) { e.stopPropagation(); songMenu(row.dataset.id); return; }
  if (act) {
    const a = act.dataset.act;
    if (a === 'sort') return;
    if (a === 'playall') { S.set.shuffle && toggleShuffle(); return playList(S.viewList, 0, S.q ? 'Search' : S.ctxLabel); }
    if (a === 'shuffleall') { if (!S.set.shuffle) toggleShuffle(); return playList(S.viewList, Math.floor(Math.random() * S.viewList.length), S.ctxLabel); }
    if (a === 'addfiles') return $('#fileIn').click();
    if (a === 'addfolder') return $('#dirIn').click();
    if (a === 'scan') return scanDevice();
    if (a === 'watch') return watchFolder();
    if (a === 'open') { S.view.detail = { type: act.dataset.type, key: act.dataset.key }; render(); view.scrollTop = 0; pushDetailHist(); return; }
    if (a === 'back') return closeTop();
    if (a === 'newpl') return newPlaylist();
    if (a === 'plmenu') return playlistMenu();
    if (a === 'tab') { S.view = { tab: act.dataset.tab, detail: null }; S.set.tab = act.dataset.tab; saveSet(); render(); view.scrollTop = 0; return; }
    if (a === 'stats') { S.view.detail = { type: 'stats' }; render(); view.scrollTop = 0; pushDetailHist(); return; }
    if (a === 'mix') { S.view.detail = { type: 'mix', key: act.dataset.key }; render(); view.scrollTop = 0; pushDetailHist(); return; }
    if (a === 'range') { S.set.statRange = act.dataset.r; saveSet(); render(); return; }
    if (a === 'playin') { const l = (S.homeLists || {})[act.dataset.l] || []; return playList(l, +act.dataset.i, act.dataset.l === 'recent' ? 'Recently played' : ''); }
    if (a === 'toggle') { e.stopPropagation(); return toggle(); }
    if (a === 'opennp') return openNP();
    if (a === 'clearhist') { (async () => { if (await confirm2('Clear listening history?', 'Your stats, play counts, recently played and made-for-you mixes start again from zero. Your music and playlists aren’t touched.', 'Clear')) { await H.clear(); render(); toast('Listening history cleared', 1500); } })(); return; }
    if (a === 'private') return;
  }
  if (row) { const i = +row.dataset.i; if (row.dataset.id === S.cur && S.viewList[i] === S.cur) { openNP(); if (audio.paused) play(); return; } playList(S.viewList, i, S.q ? 'Search' : S.ctxLabel); }
});
view.addEventListener('change', e => { if (e.target.dataset.act === 'sort') { S.set.sort = e.target.value; saveSet(); render(); } if (e.target.dataset.act === 'private') { H.tick(); S.set.privateSession = e.target.checked; saveSet(); render(); toast(e.target.checked ? 'Private session on: listening isn’t counted' : 'Private session off', 1600); } });
view.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row,.card,.tile,.hcard,.acard,.mix,.cont')) { e.preventDefault(); e.target.click(); } });
view.addEventListener('contextmenu', e => { const row = e.target.closest('.row[data-id]'); if (row) { e.preventDefault(); songMenu(row.dataset.id); } });

$('#mini').onclick = e => { if (!e.target.isConnected || e.target.closest('button')) return; openNP(); };
$('#mini').onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === $('#mini')) { e.preventDefault(); openNP(); } };
for (const [sel, fn] of [['#miniPlay', toggle], ['#miniNext', () => next()], ['#miniPrev', () => prev()]]) $(sel).onclick = e => { e.stopPropagation(); fn(); };
$('#playBtn').onclick = toggle; $('#nextBtn').onclick = () => next(); $('#prevBtn').onclick = () => prev();
$('#shufBtn').onclick = toggleShuffle; $('#repBtn').onclick = cycleRepeat;
$('#npClose').onclick = () => closeTop();
$('#npFav').onclick = () => toggleFav(S.cur);
$('#npMore').onclick = () => S.cur && songMenu(S.cur);
$('#muteBtn').onclick = toggleMute;
$('#volR').oninput = e => setVol(e.target.value / 100);
$('#soundBtn').onclick = openSound; $('#queueBtn').onclick = openQueue; $('#sleepBtn').onclick = sleepMenu; $('#speedBtn').onclick = speedMenu;
$('#sheetX').onclick = () => closeTop(); $('#scrim').onclick = () => closeTop();
const seekR = $('#seek');
seekR.addEventListener('input', () => { seeking = true; const d = audio.duration || curTrack()?.duration || 0; const t = seekR.value / 1000 * d; $('#tCur').textContent = fmt(t); seekR.style.setProperty('--p', seekR.value / 10 + '%'); });
seekR.addEventListener('change', () => { const d = audio.duration; if (isFinite(d)) seekTo(seekR.value / 1000 * d); seeking = false; updatePositionState(); });
seekR.addEventListener('pointerup', () => setTimeout(() => { seeking = false; }, 0));

/* keyboard */
addEventListener('keydown', e => {
  if (e.target.closest('input:not([type=range]),select,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape' && layers.length) { e.preventDefault(); closeTop(); return; }
  if (e.target.matches('input[type=range]') && k.startsWith('Arrow')) return;
  if (k === ' ' && !e.target.closest('button,.row,.card,[role=button]')) { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? next() : seekTo(audio.currentTime + 5); }
  else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? prev() : seekTo(audio.currentTime - 5); }
  else if (k === 'ArrowUp' && !e.target.closest('main')) { e.preventDefault(); setVol(S.set.vol + .05); toast(`Volume ${Math.round(S.set.vol * 100)}%`, 700); }
  else if (k === 'ArrowDown' && !e.target.closest('main')) { e.preventDefault(); setVol(S.set.vol - .05); toast(`Volume ${Math.round(S.set.vol * 100)}%`, 700); }
  else if (k === 'm' || k === 'M') toggleMute();
  else if (k === 's' || k === 'S') toggleShuffle();
  else if (k === 'r' || k === 'R') cycleRepeat();
  else if ((k === 'l' || k === 'L') && S.cur) toggleFav(S.cur);
  else if (k === '/') { e.preventDefault(); $('#q').focus(); }
});

/* drag & drop */
let dragN = 0;
addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragN++; $('#drop').classList.add('show'); } });
addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('#drop').classList.remove('show'); });
addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; $('#drop').classList.remove('show');
  const dt = e.dataTransfer; if (!dt) return; const out = [];
  const items = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (items.length) {
    const walk = async en => { if (en.isFile) { await new Promise(r => en.file(f => { out.push(f); r(); }, r)); } else if (en.isDirectory) { const rd = en.createReader(); let batch; do { batch = await new Promise(r => rd.readEntries(r, () => r([]))); for (const c of batch) await walk(c); } while (batch.length); } };
    for (const en of items) await walk(en);
  } else out.push(...dt.files);
  if (out.length) importFiles(out);
});

/* lifecycle */
document.addEventListener('visibilitychange', () => { if (document.hidden) { H.tick(); H.flush(); }
  if (document.hidden) { saveSession(); return; }
  vizLoop(); updateSleepUI();
  if (wantPlay) { A.resume(); if (audio.paused && !audio.ended && S.cur) play(); }
  if (NATIVE) {
    if (S.permPending) { S.permPending = false; if (window.CastelMedia.hasPermission()) scanDevice(); }
    else if (S.set.autoScan && Date.now() - S.lastScan > 30000 && window.CastelMedia.hasPermission()) scanDevice({ silent: true });
  }
});
addEventListener('pagehide', () => { saveSession(); H.tick(); H.flush(); });
addEventListener('beforeunload', saveSession);
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => S.set.theme === 'system' && applyTheme());
addEventListener('unhandledrejection', e => console.warn('Unhandled', e.reason));
// Unlock Web Audio on first interaction (mobile autoplay policies)
const unlock = () => { A.init(); A.resume(); removeEventListener('pointerdown', unlock, true); removeEventListener('keydown', unlock, true); };
addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true);

/* ================= Boot ================= */

/* ================= Sponsor strip (works like KodeX's) =================
   #topAdSafeArea / #topAdSlot are the same as in KodeX, so the KodeX Master Editor can add sponsor
   banners to muSync too. The strip sits above everything at the top, and the page, the player
   and the panels start below it, so it never covers a button or text. */
function kxRotate(C, s) {
  if (!s || !C.b.length) return function () {};
  s.classList.add('kx-on'); s.textContent = ''; var i = -1, tm, dead = false;
  function mk(b) { var e = document.createElement(b.u ? 'a' : 'div'); if (b.u) { e.href = b.u; e.target = '_blank'; e.rel = 'noopener noreferrer sponsored'; } e.className = 'kx-sp'; var m = new Image(); m.alt = 'Sponsor'; m.decoding = 'async'; m.src = b.d; e.appendChild(m); return e; }
  function step() { var n = i + 1; if (C.o === 'random' && C.b.length > 1) { do { n = Math.floor(Math.random() * C.b.length); } while (n === i); } else n = n % C.b.length; i = n; var e = mk(C.b[n]), old = s.querySelector('.kx-sp');
    if (C.f && old) { e.style.opacity = '0'; s.appendChild(e); void e.offsetWidth; e.style.opacity = '1'; old.style.opacity = '0'; old.style.pointerEvents = 'none'; setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 800); }
    else { if (old) old.parentNode.removeChild(old); s.appendChild(e); } }
  function loop() { tm = setTimeout(function () { if (!dead) { if (!document.hidden) step(); loop(); } }, C.t); }
  step(); if (C.b.length > 1) loop();
  return function () { dead = true; clearTimeout(tm); };
}
function syncAd() {
  const a = $('#topAdSafeArea'); const on = !!a && getComputedStyle(a).display !== 'none';
  document.documentElement.classList.toggle('has-ad', on);
  document.documentElement.style.setProperty('--adh', on ? Math.max(0, Math.round(a.getBoundingClientRect().bottom)) + 'px' : '0px');
}
syncAd(); addEventListener('resize', syncAd); addEventListener('load', syncAd);
try { new ResizeObserver(syncAd).observe($('#topAdSafeArea')); } catch {}
function houseAds() {
  const slot = $('#topAdSlot');
  // Sponsor banners from the KodeX Master Editor take over the strip.
  if (!slot || document.getElementById('kx-sponsor-data') || slot.classList.contains('kx-on')) return;
  try { const c = JSON.parse($('#musync-house-ads').textContent); if (c && Array.isArray(c.b) && c.b.length) kxRotate({ t: Math.max(2000, +c.t || 8000), o: c.o, f: c.f !== false, b: c.b.filter(x => x && typeof x.d === 'string' && /^data:image\/|^https:/.test(x.d)).map(x => ({ d: x.d, u: /^https?:\/\//.test(x.u || '') ? x.u : '' })) }, slot); } catch (e) { console.warn('house ads', e); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', houseAds); else setTimeout(houseAds, 0);

async function boot() {
  applyTheme(); updateModes(); updateVolUI(); updatePlayState(); A.apply();
  try {
    await DB.open();
    const all = await DB.all('tracks');
    for (const t of all || []) if (t && t.id) S.tracks.set(t.id, t);
  } catch (e) { console.warn('Storage unavailable', e); S.persistOK = false; }
  await H.load();
  // prune stale ids
  S.favs = new Set([...S.favs].filter(id => S.tracks.has(id))); saveFavs();
  S.playlists.forEach(p => { if (!Array.isArray(p.ids)) p.ids = []; p.ids = p.ids.filter(id => S.tracks.has(id)); });
  render();
  const ses = lsGet('pp.session', null);
  if (ses && Array.isArray(ses.queue)) {
    S.queue = ses.queue.filter(id => S.tracks.has(id)); S.orig = (ses.orig || ses.queue).filter(id => S.tracks.has(id)); S.ctxName = ses.ctx || '';
    if (ses.cur && S.tracks.has(ses.cur)) { S.qi = Math.max(0, S.queue.indexOf(ses.cur)); if (!S.queue.includes(ses.cur)) { S.queue.unshift(ses.cur); S.qi = 0; } await loadTrack(ses.cur, { autoplay: false, pos: ses.pos || 0 }); }
    else if (S.queue.length) { S.qi = 0; await loadTrack(S.queue[0], { autoplay: false }); }
  }
  if (!S.persistOK) toast('Storage is blocked — your library will reset when the app closes', 5000);
  if (MOBILE) $('#fileIn').accept = 'audio/*';
  if (NATIVE) {
    let allowed = false; try { allowed = window.CastelMedia.hasPermission(); } catch {}
    if (allowed ? S.set.autoScan : !lsGet('pp.askedScan', false)) scanDevice({ silent: allowed && S.tracks.size > 0 });
  } else if (CAN_WATCH_FOLDER && S.set.autoScan) rescanFolder(false);
  window.__musync = window.__pulse = { S, A, audio, DB, Tags, next, prev, play, pause, toggle, playList, playNext, addQueue, removeTracks, importFiles, closeAll, layers, scanDevice, syncNative, handleEnded, NATIVE, ENGINE, el, syncNextHint, H, render, mixList }; // test/debug hook
}
boot();
})();
