[data-theme=light]{--bg:#f3f6fc;--bg2:#ffffff;--bg3:#e9eef8;--bg4:#d5dceb;--fg:#0d1426;--fg2:#56607a;--fg3:#8790a6;--line:#dbe2ef;--shadow:0 10px 30px rgba(20,40,90,.12);--grad:radial-gradient(circle at top,#dfe9ff 0,#f3f6fc 52%) #f3f6fc;--accfg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--grad);color:var(--fg);overscroll-behavior:none}
body{font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible,.card:focus-visible,[role=button]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;color:inherit}
input[type=search],input:not([type]),input[type=text]{-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.f{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;padding-top:var(--st)}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding-left:16px;padding-right:16px}
/* header (KodeX) */
header.top{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:6px}
.logo{width:46px;height:46px;flex:none;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 4px var(--acc)) drop-shadow(0 0 10px var(--glow))}
.ttl{flex:1;min-width:0}
.brand{font-size:.66rem;letter-spacing:.18em;color:var(--acc);font-weight:800;text-transform:uppercase}
.title{font-size:1.25rem;font-weight:850;line-height:1.15;letter-spacing:-.01em}
.title b{color:var(--acc);font-weight:850}
.subt{color:var(--fg2);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--fg)}
.ib:hover{background:var(--soft2)}
.ib:disabled{opacity:.35;cursor:default}
.search{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:3px 4px 3px 14px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;margin:6px 0 10px}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.search input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;color:var(--fg);font-size:1rem}
.search input::-webkit-search-cancel-button{display:none}
.search>svg{color:var(--fg2);width:20px;height:20px}
.search .clr{display:none;color:var(--fg2);width:40px;height:40px;border-radius:12px;place-items:center}
.search.has .clr{display:grid}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:16px;-webkit-overflow-scrolling:touch}
/* lists */
.lh{display:flex;align-items:center;gap:8px;padding:6px 2px 10px;flex-wrap:wrap}
.lh h2{font-size:1.35rem;margin:0;letter-spacing:-.01em;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850}
.lh .sub{color:var(--fg2);font-size:.8rem;width:100%;margin-top:-4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);font-weight:700;font-size:.875rem;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:transparent}
.btn.dan{color:var(--danger)}
.btn:disabled{opacity:.4}
select.sel{height:38px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);padding:0 10px;font-size:.85rem;font-weight:700;max-width:150px;color:var(--fg)}
.row{display:grid;grid-template-columns:48px 1fr auto 36px;align-items:center;gap:12px;padding:7px 8px;border-radius:14px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 62px}
.row:hover{background:var(--soft2)}
.row .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{color:var(--fg2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{min-width:0}
.row .d{color:var(--fg3);font-size:.8rem;font-variant-numeric:tabular-nums}
.row.on{background:var(--soft2)}
.row.on .t{color:var(--acc)}
.row.bad{opacity:.45}
.more{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg2)}
.more:hover{background:var(--soft)}
.art{width:48px;height:48px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--fg3);flex:none}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art svg{width:22px;height:22px}
.art .bars{position:absolute;inset:0;background:rgba(6,10,20,.55);display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:14px}
.row.on .art .bars{display:flex}
.bars i{width:3px;background:var(--acc);border-radius:2px;height:6px;animation:eqb 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.4s}.bars i:nth-child(3){animation-delay:-.7s}
.paused .bars i{animation-play-state:paused}
@keyframes eqb{0%,100%{height:5px}50%{height:18px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:4px 2px}
.card{cursor:pointer;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px}
.card .art{width:100%;height:auto;aspect-ratio:1;border-radius:12px;border:0}
.card .art svg{width:40%;height:40%}
.card b{display:block;margin-top:8px;font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;color:var(--fg2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:48px 24px;color:var(--fg2)}
.empty .big{width:96px;height:96px;margin:0 auto 18px;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 6px var(--acc)) drop-shadow(0 0 18px var(--glow))}
.empty h3{color:var(--fg);margin:0 0 6px;font-size:1.15rem}
.empty p{margin:0 0 20px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drop{position:fixed;inset:0;z-index:90;background:var(--soft);border:3px dashed var(--acc);display:none;place-items:center;font-size:22px;font-weight:800;pointer-events:none}
.drop.show{display:grid}
/* mini player */
.mini{position:relative;display:none;align-items:center;gap:10px;margin:0 10px 8px;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;cursor:pointer;box-shadow:var(--shadow)}
.mini.show{display:flex}
@media (min-width:1020px){.mini{max-width:980px;margin-left:auto;margin-right:auto;width:calc(100% - 20px)}}
.mini .art{width:46px;height:46px}
.mini .m{flex:1;min-width:0}
.mini .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .a{color:var(--fg2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pb{position:absolute;left:16px;right:16px;bottom:3px;height:2px;background:var(--bg4);border-radius:2px;overflow:hidden}
.mini .pb i{display:block;height:100%;background:var(--acc);width:0;box-shadow:0 0 8px var(--glow)}
.playb{width:46px;height:46px;border-radius:14px;background:var(--acc);color:var(--accfg);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px var(--soft)}
/* bottom navigation (KodeX) */
.bnav{flex:none;background:rgba(10,13,22,.96);border-top:1px solid var(--line);padding-bottom:var(--sb);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
[data-theme=light] .bnav{background:rgba(255,255,255,.96)}
.bnav>div{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.tab{color:var(--fg2);font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px}
.tab .ic{padding:3px 16px;border-radius:99px;transition:background .15s;display:grid;place-items:center}
.tab .ic svg{width:21px;height:21px}
.tab[aria-selected=true]{color:var(--fg)}
.tab[aria-selected=true] .ic{background:var(--soft);color:var(--acc)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(2,4,10,.6);opacity:0;pointer-events:none;transition:opacity .22s;z-index:70}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.45);padding-bottom:var(--sb);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
@media (min-width:700px){.sheet{left:50%;width:560px;margin-left:-280px;bottom:16px;border-radius:22px;border-bottom:1px solid var(--line);max-height:84dvh}}
.sh{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 18px}
.sh h3{margin:0;flex:1;font-size:1.1rem;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{overflow-y:auto;padding:4px 18px 18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bg4);margin:8px auto 0}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 8px;border-radius:12px;text-align:left;font-size:.95rem}
.menu button:hover{background:var(--soft2)}
.menu button svg{color:var(--acc)}
.menu .dan,.menu .dan svg{color:var(--danger)}
.menu .chk{margin-left:auto;color:var(--acc)}
.fld{display:block;margin:0 0 12px}
.fld span{display:block;font-size:.8rem;color:var(--fg2);margin-bottom:4px}
.fld input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:none}
.fld input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.msg{color:var(--fg2);margin:0 0 14px}
/* now playing */
.np{position:fixed;inset:0;z-index:60;background:var(--grad);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden;padding:var(--st) 0 var(--sb)}
.np.show{transform:none;visibility:visible}
.np .bgart{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.28;transform:scale(1.3);pointer-events:none}
[data-theme=light] .np .bgart{opacity:.18}
.np .in{position:relative;flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding:6px 22px 14px;min-height:0}
.nph{display:flex;align-items:center;justify-content:space-between}
.nph .lbl{flex:1;text-align:center;overflow:hidden;padding:0 6px}
.nph .lbl .brand{display:block}
.nph .lbl span{display:block;font-size:.78rem;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npart{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;padding:14px 0;position:relative}
.npart .art{width:min(100%,46dvh,420px);height:auto;aspect-ratio:1;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--line);border:0;background:var(--bg2)}
.npart .art .ph{width:44%;height:44%}
.np-logo{width:46%;height:46%;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 6px var(--acc)) drop-shadow(0 0 22px var(--glow))}
#viz{position:absolute;left:0;right:0;bottom:6px;height:56px;width:100%;pointer-events:none;opacity:.9}
.npt{display:flex;align-items:center;gap:10px;margin-top:4px}
.npt .m{flex:1;min-width:0}
.npt h2{margin:0;font-size:1.4rem;font-weight:850;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npt p{margin:2px 0 0;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav.on{color:var(--acc)}
.fav.on svg{fill:currentColor}
.seek{margin-top:14px}
.times{display:flex;justify-content:space-between;color:var(--fg2);font-size:.75rem;font-variant-numeric:tabular-nums;margin-top:2px}
.ctr{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.ctr .ib{width:50px;height:50px;position:relative}
.ctr .ib.on{color:var(--acc)}
.ctr .ib .badge{position:absolute;font-size:9px;font-weight:900;margin:14px 0 0 14px;color:var(--acc)}
.bigplay{width:74px;height:74px;border-radius:24px;background:var(--acc);color:var(--accfg);display:grid;place-items:center;box-shadow:0 10px 30px var(--soft),0 0 24px var(--glow)}
.bigplay svg{width:32px;height:32px}
.vol{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.vol input{flex:1}
.npx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.npx button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--fg2);font-weight:700;padding:8px 4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);min-width:0}
.npx button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.npx button.on{color:var(--acc);border-color:var(--acc);background:var(--soft2)}
/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p) 100% no-repeat,var(--bg4)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--bg4)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px;box-shadow:0 0 0 3px var(--soft),0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.4}
/* sound panel */
.sec{background:var(--bg3);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.sec h4{margin:0;font-size:.9rem;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec h4 output{color:var(--acc);font-variant-numeric:tabular-nums;font-weight:850}
.sec .hint{font-size:.75rem;color:var(--fg2);margin:2px 0 0;font-weight:400}
.eqr{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:8px;font-size:.75rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.eqr span:last-child{text-align:right}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--bg4);transition:.2s}
.sw i::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:7px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--fg2)}
.chip.on{background:var(--soft);border-color:var(--acc);color:var(--acc)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow b{display:block;font-weight:700}
.srow small{color:var(--fg2)}
.sgrp{font-size:.66rem;letter-spacing:.18em;color:var(--acc);font-weight:800;text-transform:uppercase;margin:16px 0 2px}
.swatch{width:30px;height:30px;border-radius:10px;border:2px solid transparent}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg2) inset}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.links a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;font-size:.85rem}
.links a svg{color:var(--acc);width:18px;height:18px}
.about{display:flex;align-items:center;gap:12px;padding:14px 0 4px}
.about .logo{width:40px;height:40px}
/* queue */
.qrow{grid-template-columns:28px 40px 1fr 36px}
.qrow .art{width:40px;height:40px}
.handle{color:var(--fg3);cursor:grab;touch-action:none;display:grid;place-items:center;height:40px}
.qrow.drag{background:var(--bg3);box-shadow:var(--shadow);position:relative;z-index:2;transition:none}
.qlbl{font-size:.66rem;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.18em;padding:12px 8px 4px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 84px + var(--sb));transform:translate(-50%,20px);background:var(--bg3);color:var(--fg);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;font-size:.875rem;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.8rem;color:var(--fg2)}
.kbd kbd{font-family:inherit;background:var(--bg4);color:var(--fg);border-radius:6px;padding:2px 7px;font-size:.75rem;font-weight:700;justify-self:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.subt{display:none}.tab .ic{padding:3px 10px}}
</style>

let importing = false; const importQ = [];
async function importFiles(fileList, { quiet = false } = {}) {
  const files = [...fileList].filter(isAudio);
  const skipped = fileList.length - files.length;
  if (!files.length) { if (!quiet) toast(skipped ? 'No audio files found' : 'Nothing selected'); return; }
  importQ.push(...files); if (importing) return; importing = true;
  const sigs = new Set([...S.tracks.values()].map(t => t.sig));
  let added = 0, dup = 0, fail = 0, vol = 0, done = 0;
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    while (importQ.length) {
      const f = importQ.shift(); done++;
      if (!quiet || done === 1) toast(`Adding music… ${done}/${done + importQ.length}`, 60000);
      const sig = `${f.name}|${f.size}|${f.lastModified || 0}`;
      if (sigs.has(sig)) { dup++; continue; }
      try {
        const dur = await probeDuration(f);
        if (dur < 0) { fail++; continue; }
        const tg = await Tags.read(f); const fn = fromName(f.name);
        let art = null, thumb = null;
        if (tg.pic && tg.pic.size > 0) { thumb = await makeThumb(tg.pic); if (thumb) art = tg.pic.size > 2.5e6 ? await makeThumb(tg.pic, 900) || thumb : tg.pic; }
        const id = uid();
        const meta = { id, sig, name: f.name, title: tg.title || fn.title || f.name, artist: tg.artist || fn.artist || '', album: tg.album || '', albumArtist: tg.albumArtist || '', year: tg.year || '', genre: tg.genre || '', trackNo: parseInt(tg.track) || 0, duration: dur, size: f.size, mime: f.type || '', added: Date.now() + done, art: !!thumb, plays: 0 };
        const blob = f.slice(0, f.size, f.type || 'audio/mpeg');
        let saved = false;
        if (DB.db) { try { await DB.addFull(meta, blob, art, thumb); saved = true; } catch (e) { console.warn('persist failed', e); } }
        if (!saved) { S.mem.set(id, f); meta._thumb = thumb; meta._art = art; vol++; }
        S.tracks.set(id, meta); sigs.add(sig); added++;
        if (added % 10 === 0) render();
      } catch (e) { console.warn('import', f.name, e); fail++; }
    }
  } finally { importing = false; }

  if (added) parts.push(`Added ${added} song${added > 1 ? 's' : ''}`);
  if (dup) parts.push(`${dup} already in library`);
  if (fail) parts.push(`${fail} couldn't be read`);
  toast(parts.join(' · ') || 'Nothing added', 3500);
  if (vol) setTimeout(() => toast(`Storage is full: ${vol} song${vol > 1 ? 's' : ''} will only stay until the app closes`, 5000), 3600);
  if (added && !S.cur) { const first = sortedLib()[0]; if (first) { S.queue = sortedLib().map(t => t.id); S.orig = S.queue.slice(); S.qi = S.queue.indexOf(first.id); S.ctxName = 'Songs'; loadTrack(first.id, { autoplay: false }); } }
}

/* ================= Visualizer ================= */
const viz = $('#viz'); let vizRaf = 0;
function vizLoop() {
  if (vizRaf || !S.set.viz) return;
  const ctx = viz.getContext('2d'); let data = null, last = 0; const lv = new Float32Array(40);
  const color = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#67a8ff';
  const draw = ts => {
    if (audio.paused || document.hidden || !$('#np').classList.contains('show') || !S.set.viz) { vizRaf = 0; ctx.clearRect(0, 0, viz.width, viz.height); return; }
    vizRaf = requestAnimationFrame(draw);
    if (ts - last < 33) return; last = ts; // ~30 fps keeps the page light
    const dpr = Math.min(2, devicePixelRatio || 1), w = viz.clientWidth, h = viz.clientHeight;
    if (viz.width !== Math.round(w * dpr)) { viz.width = Math.round(w * dpr); viz.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const bars = lv.length, bw = w / bars;
    if (A.live && !audio.native) {
      if (!data) data = new Uint8Array(A.n.an.frequencyBinCount);
      A.n.an.getByteFrequencyData(data);
      for (let i = 0; i < bars; i++) lv[i] = data[Math.floor(Math.pow(i / bars, 1.6) * (data.length * .85))] / 255;
    } else {
      const t = ts / 1000; // decorative pulse when the spectrum isn't available
      for (let i = 0; i < bars; i++) lv[i] = lv[i] * .7 + .3 * (.25 + .35 * Math.abs(Math.sin(t * 2.1 + i * .55)) * (.6 + .4 * Math.sin(t * .9 + i * .21)));
    }
    ctx.fillStyle = color; ctx.globalAlpha = .7;
    for (let i = 0; i < bars; i++) { const bh = Math.max(2, lv[i] * h); ctx.fillRect(i * bw + 1, h - bh, Math.max(1, bw - 2), bh); }
  };
  vizRaf = requestAnimationFrame(draw);
}

/* ================= Layers (sheets/modal) with Android back support ================= */
const layers = []; const popWaiters = [];
function pushLayer(name, close) { const l = { name, close, hist: true }; try { history.pushState({ pp: layers.length + 1 }, ''); } catch { l.hist = false; } layers.push(l); }
function closeTop() {
  return new Promise(res => {
    const l = layers[layers.length - 1]; if (!l) return res();
    if (l.hist) { popWaiters.push(res); history.back(); setTimeout(() => { const i = popWaiters.indexOf(res); if (i >= 0) { popWaiters.splice(i, 1); if (layers[layers.length - 1] === l) { layers.pop(); l.close(); } res(); } }, 500); }
    else { layers.pop(); l.close(); res(); }
  });
}
addEventListener('popstate', () => { const l = layers.pop(); if (l) l.close(); const w = popWaiters.shift(); if (w) w(); });
async function closeAll() { while (layers.length) await closeTop(); }

function dragStart(e) {

  row.classList.add('drag'); try { e.target.setPointerCapture(e.pointerId); } catch {}

  const move = ev => {
    dy = ev.clientY - y0 + (cont.scrollTop - sc0); const to = clamp(from + Math.round(dy / H), min, max);
    const ty = clamp(dy, (min - from) * H, (max - from) * H); row.style.transform = `translateY(${ty}px)`;
    const r = cont.getBoundingClientRect(); if (ev.clientY < r.top + 40) cont.scrollTop -= 8; else if (ev.clientY > r.bottom - 40) cont.scrollTop += 8;

function clearSleep() { if (S.sleep) { clearInterval(S.sleep.iv); S.sleep = null; } if (S.fade !== 1) { S.fade = 1; A.apply(); } updateSleepUI(); syncNextHint(); }

  clearSleep();

  const end = Date.now() + min * 60000;
  S.sleep = { mode: 'time', end, iv: setInterval(() => {
    const left = (S.sleep.end - Date.now()) / 1000; updateSleepUI();
    if (left <= 10 && left > 0) { S.fade = Math.max(.02, left / 10); A.apply(); } // fade out over the last 10 seconds
    if (left <= 0) { wantPlay = false; audio.pause(); clearSleep(); toast('Sleep timer: stopped'); }

/* keyboard */
addEventListener('keydown', e => {
  if (e.target.closest('input:not([type=range]),select,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape' && layers.length) { e.preventDefault(); closeTop(); return; }
  if (e.target.matches('input[type=range]') && k.startsWith('Arrow')) return;
  if (k === ' ' && !e.target.closest('button,.row,.card,[role=button]')) { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? next() : seekTo(audio.currentTime + 5); }
  else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? prev() : seekTo(audio.currentTime - 5); }
  else if (k === 'ArrowUp' && !e.target.closest('main')) { e.preventDefault(); setVol(S.set.vol + .05); toast(`Volume ${Math.round(S.set.vol * 100)}%`, 700); }
  else if (k === 'ArrowDown' && !e.target.closest('main')) { e.preventDefault(); setVol(S.set.vol - .05); toast(`Volume ${Math.round(S.set.vol * 100)}%`, 700); }
  else if (k === 'm' || k === 'M') toggleMute();
  else if (k === 's' || k === 'S') toggleShuffle();
  else if (k === 'r' || k === 'R') cycleRepeat();
  else if ((k === 'l' || k === 'L') && S.cur) toggleFav(S.cur);
  else if (k === '/') { e.preventDefault(); $('#q').focus(); }
});

/* drag & drop */
let dragN = 0;
addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragN++; $('#drop').classList.add('show'); } });
addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('#drop').classList.remove('show'); });
addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; $('#drop').classList.remove('show');
  const dt = e.dataTransfer; if (!dt) return; const out = [];
  const items = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (items.length) {
    const walk = async en => { if (en.isFile) { await new Promise(r => en.file(f => { out.push(f); r(); }, r)); } else if (en.isDirectory) { const rd = en.createReader(); let batch; do { batch = await new Promise(r => rd.readEntries(r, () => r([]))); for (const c of batch) await walk(c); } while (batch.length); } };
    for (const en of items) await walk(en);
  } else out.push(...dt.files);
  if (out.length) importFiles(out);
});

/* lifecycle */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveSession(); return; }
  vizLoop(); updateSleepUI();
  if (wantPlay) { A.resume(); if (audio.paused && !audio.ended && S.cur) play(); }
  if (NATIVE) {
    if (S.permPending) { S.permPending = false; if (window.CastelMedia.hasPermission()) scanDevice(); }
    else if (S.set.autoScan && Date.now() - S.lastScan > 30000 && window.CastelMedia.hasPermission()) scanDevice({ silent: true });
  }
});
addEventListener('pagehide', saveSession);
addEventListener('beforeunload', saveSession);
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => S.set.theme === 'system' && applyTheme());
addEventListener('unhandledrejection', e => console.warn('Unhandled', e.reason));
// Unlock Web Audio on first interaction (mobile autoplay policies)
const unlock = () => { A.init(); A.resume(); removeEventListener('pointerdown', unlock, true); removeEventListener('keydown', unlock, true); };
addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true);

/* ================= Boot ================= */
async function boot() {
  applyTheme(); updateModes(); updateVolUI(); updatePlayState(); A.apply();
  try {
    await DB.open();
    const all = await DB.all('tracks');
    for (const t of all || []) if (t && t.id) S.tracks.set(t.id, t);
  } catch (e) { console.warn('Storage unavailable', e); S.persistOK = false; }
  // prune stale ids
  S.favs = new Set([...S.favs].filter(id => S.tracks.has(id))); saveFavs();
  S.playlists.forEach(p => { if (!Array.isArray(p.ids)) p.ids = []; p.ids = p.ids.filter(id => S.tracks.has(id)); });
  render();
  const ses = lsGet('pp.session', null);
  if (ses && Array.isArray(ses.queue)) {
    S.queue = ses.queue.filter(id => S.tracks.has(id)); S.orig = (ses.orig || ses.queue).filter(id => S.tracks.has(id)); S.ctxName = ses.ctx || '';
    if (ses.cur && S.tracks.has(ses.cur)) { S.qi = Math.max(0, S.queue.indexOf(ses.cur)); if (!S.queue.includes(ses.cur)) { S.queue.unshift(ses.cur); S.qi = 0; } await loadTrack(ses.cur, { autoplay: false, pos: ses.pos || 0 }); }
    else if (S.queue.length) { S.qi = 0; await loadTrack(S.queue[0], { autoplay: false }); }
  }
  if (!S.persistOK) toast('Storage is blocked — your library will reset when the app closes', 5000);
  if (MOBILE) $('#fileIn').accept = 'audio/*';
  if (NATIVE) {
    let allowed = false; try { allowed = window.CastelMedia.hasPermission(); } catch {}
    if (allowed ? S.set.autoScan : !lsGet('pp.askedScan', false)) scanDevice({ silent: allowed && S.tracks.size > 0 });
  } else if (CAN_WATCH_FOLDER && S.set.autoScan) rescanFolder(false);
  window.__musync = window.__pulse = { S, A, audio, DB, Tags, next, prev, play, pause, toggle, playList, playNext, addQueue, removeTracks, importFiles, closeAll, layers, scanDevice, syncNative, handleEnded, NATIVE, ENGINE, el, syncNextHint }; // test/debug hook
}
boot();
})();
</script>
