[data-theme=light]{--bg:#f5f6fb;--bg2:#ffffff;--bg3:#eceef7;--bg4:#dcdfed;--fg:#121528;--fg2:#5c6280;--fg3:#8a90aa;--ink2:#2c3150;--line:#e0e3ef;--shadow:0 12px 36px rgba(30,40,90,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
/* the site's hero light: brand glow, violet and ember, with a faint duel-field grid */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(620px 360px at 96% -4%,rgba(243,147,80,.13),transparent 70%),radial-gradient(760px 440px at 62% -22%,rgba(112,136,255,.22),transparent 70%),radial-gradient(560px 360px at -8% 108%,rgba(169,136,239,.12),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(238,240,248,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(238,240,248,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 55%);mask-image:linear-gradient(180deg,#000,transparent 55%)}
[data-theme=light] body::after{background-image:linear-gradient(rgba(18,21,40,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(18,21,40,.04) 1px,transparent 1px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible,.card:focus-visible,[role=button]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;height:100dvh;padding-top:var(--st);max-width:1100px;margin:0 auto}
h2,h3,h4,.brand,.lh h2,.sh h3,.npt h2,.tab,.btn,.chip,.qlbl,.sgrp,.times,.row .d{font-family:var(--f-display)}
/* header (Pulse layout) */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:32px;height:32px}
.brand .wm{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{flex:none;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 3px var(--acc)) drop-shadow(0 0 10px var(--glow))}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:42px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;-webkit-user-select:text;user-select:text}
.search input::-webkit-search-cancel-button{display:none}
.search>svg{width:18px;height:18px;color:var(--fg3)}
.search .clr{display:none;color:var(--fg3);width:32px;height:32px;border-radius:50%;place-items:center}
.search .clr svg{width:18px;height:18px}
.search.has .clr{display:grid}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg);transition:background .15s}
.ib:hover{background:var(--soft2)}
.ib:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 16px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--fg2);font-weight:600;font-size:14px;letter-spacing:.02em;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.tab[aria-selected=true]{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 6px 20px var(--soft)}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 8px 16px;-webkit-overflow-scrolling:touch}
/* lists */
.lh{display:flex;align-items:center;gap:8px;padding:8px 8px 12px;flex-wrap:wrap}
.lh h2{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh .sub{color:var(--fg2);font-size:13px;width:100%;margin-top:-4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 6px 20px var(--soft)}
.btn.pri svg{fill:currentColor}
.btn.dan{color:var(--danger)}
.btn:disabled{opacity:.4}
select.sel{height:38px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);padding:0 12px;font-size:13px;font-weight:600;max-width:160px;color:var(--fg)}
.row{display:grid;grid-template-columns:48px 1fr auto 36px;align-items:center;gap:12px;padding:7px 8px;border-radius:14px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 62px;user-select:none;-webkit-user-select:none;transition:background .12s}
.row:hover{background:var(--soft2)}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{min-width:0}
.row .d{color:var(--fg3);font-size:13px;font-variant-numeric:tabular-nums}
.row.on{background:var(--soft2)}
.row.on .t{color:var(--acc)}
.row.bad{opacity:.45}
.more{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg2)}
.more:hover{background:var(--soft)}
.art{width:48px;height:48px;border-radius:11px;background:var(--bg3);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--fg3);flex:none}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art svg{width:22px;height:22px}
.art .bars{position:absolute;inset:0;background:rgba(6,8,18,.55);display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:14px}
.row.on .art .bars{display:flex}
.bars i{width:3px;background:#fff;border-radius:2px;height:6px;animation:eqb 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.4s}.bars i:nth-child(3){animation-delay:-.7s}
.paused .bars i{animation-play-state:paused}
@keyframes eqb{0%,100%{height:5px}50%{height:18px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:4px 8px}
.card{cursor:pointer;min-width:0}
.card .art{width:100%;height:auto;aspect-ratio:1;border-radius:16px;transition:transform .2s,box-shadow .2s}
.card:hover .art{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .art svg{width:40%;height:40%}
.card b{display:block;margin-top:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:56px 24px;color:var(--fg2)}
.empty .big{width:92px;height:92px;margin:0 auto 20px;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 6px var(--acc)) drop-shadow(0 0 20px var(--glow))}
.empty h3{color:var(--fg);margin:0 0 6px;font-size:22px;font-weight:700}
.empty p{margin:0 auto 22px;max-width:420px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drop{position:fixed;inset:0;z-index:90;background:var(--soft);border:3px dashed var(--acc);display:none;place-items:center;font-family:var(--f-display);font-size:22px;font-weight:700;pointer-events:none}
.drop.show{display:grid}
/* mini player */
.mini{position:relative;display:none;align-items:center;gap:10px;margin:0 10px calc(10px + var(--sb));padding:8px;background:rgba(17,20,31,.88);border:1px solid var(--line);border-radius:20px;cursor:pointer;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
[data-theme=light] .mini{background:rgba(255,255,255,.9)}
.mini.show{display:flex}
.mini .art{width:46px;height:46px}
.mini .m{flex:1;min-width:0}
.mini .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .a{color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pb{position:absolute;left:18px;right:18px;bottom:3px;height:2px;background:var(--bg4);border-radius:2px;overflow:hidden}
.mini .pb i{display:block;height:100%;background:var(--grad);width:0}
.playb{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px var(--soft)}
.playb svg,.bigplay svg{fill:currentColor}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(3,5,14,.6);opacity:0;pointer-events:none;transition:opacity .22s;z-index:70}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.7,.2,1);box-shadow:0 -12px 40px rgba(3,5,14,.5);padding-bottom:var(--sb);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
@media (min-width:700px){.sheet{left:50%;width:560px;margin-left:-280px;bottom:16px;border-radius:24px;border-bottom:1px solid var(--line);max-height:84dvh}}
.sh{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 20px}
.sh h3{margin:0;flex:1;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 20px 20px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bg4);margin:8px auto 0}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 8px;border-radius:12px;text-align:left;font-size:15px}
.menu button:hover{background:var(--soft2)}
.menu button svg{color:var(--acc)}
.menu .dan,.menu .dan svg{color:var(--danger)}
.menu .chk{margin-left:auto;color:var(--acc)}
.fld{display:block;margin:0 0 12px}
.fld span{display:block;font-size:13px;color:var(--fg2);margin-bottom:4px}
.fld input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:none;-webkit-user-select:text;user-select:text}
.fld input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.msg{color:var(--fg2);margin:0 0 14px}
/* now playing */
.np{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.7,.2,1);visibility:hidden;padding:var(--st) 0 var(--sb);overflow:hidden}
.np.show{transform:none;visibility:visible}
.np::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 80% -10%,rgba(112,136,255,.22),transparent 70%),radial-gradient(520px 340px at 0% 105%,rgba(169,136,239,.16),transparent 70%),radial-gradient(420px 300px at 100% 100%,rgba(243,147,80,.1),transparent 70%)}
.np .bgart{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(64px) saturate(1.3);opacity:.3;transform:scale(1.3);pointer-events:none}
[data-theme=light] .np .bgart{opacity:.2}
.np .in{position:relative;flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding:6px 22px 14px;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.np .in>*:not(.npart){flex:none}
.nph{display:flex;align-items:center;justify-content:space-between}
.nph .lbl{flex:1;text-align:center;overflow:hidden;padding:0 6px}
.nph .lbl .brand{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg2);font-weight:600}
.nph .lbl span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npart{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;padding:16px 0;position:relative}
.npart .art{width:min(100%,46dvh,420px);height:auto;aspect-ratio:1;border-radius:26px;border:1px solid var(--line);background:linear-gradient(160deg,var(--bg3),var(--bg2));box-shadow:0 24px 70px rgba(3,5,14,.6),0 0 60px var(--soft)}
.npart .art svg{width:35%;height:35%}
.np-logo{width:46%;height:46%;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 6px var(--acc)) drop-shadow(0 0 24px var(--glow))}
#viz{position:absolute;left:0;right:0;bottom:8px;height:56px;width:100%;pointer-events:none;opacity:.85}
.npt{display:flex;align-items:center;gap:10px;margin-top:4px}
.npt .m{flex:1;min-width:0}
.npt h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npt p{margin:2px 0 0;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav.on{color:var(--acc)}
.fav.on svg{fill:currentColor}
.seek{margin-top:14px}
.times{display:flex;justify-content:space-between;color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:.04em}
.ctr{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.ctr .ib{width:50px;height:50px;position:relative}
.ctr .ib.on{color:var(--acc)}
.ctr .ib .badge{position:absolute;font-family:var(--f-display);font-size:9px;font-weight:700;margin:14px 0 0 14px;color:var(--acc)}
.bigplay{width:76px;height:76px;border-radius:50%;background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;box-shadow:0 12px 32px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.bigplay svg{width:32px;height:32px}
.vol{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.vol input{flex:1}
.npx{display:flex;justify-content:space-around;margin-top:6px}
.npx button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--fg2);font-weight:600;padding:8px 10px;border-radius:14px;min-width:64px}
.npx button span{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.npx button.on{color:var(--acc);background:var(--soft2)}
.npx button:hover{background:var(--soft2)}
/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2)) 0/var(--p) 100% no-repeat,var(--bg4)}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--bg4)}
input[type=range]::-moz-range-progress{height:4px;border-radius:3px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;margin-top:-5.5px;box-shadow:0 0 0 4px var(--soft),0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.4}
/* sound panel */
.sec{background:var(--bg3);border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin-bottom:12px}
.sec h4{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;letter-spacing:.01em}
.sec h4 output{color:var(--acc);font-variant-numeric:tabular-nums}
.sec .hint{font-family:var(--f-body);font-size:12px;color:var(--fg2);margin:2px 0 0;font-weight:400;letter-spacing:0}
.eqr{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:8px;font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.eqr span:last-child{text-align:right}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--bg4);transition:.2s}
.sw i::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:6px 13px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.chip.on{background:var(--acc);border-color:transparent;color:#fff}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow b{display:block;font-weight:700}
.srow small{color:var(--fg2)}
.sgrp{font-size:12px;letter-spacing:.14em;color:var(--fg2);font-weight:600;text-transform:uppercase;margin:18px 0 4px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg2) inset}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.links a{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:14px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:14px}
.links a:hover{border-color:var(--acc)}
.links a svg{color:var(--acc);width:18px;height:18px}
.about{display:flex;align-items:center;gap:12px;padding:16px 0 4px}
.about .logo{width:40px;height:40px}
.about b{font-family:var(--f-display)}
/* queue */
.qrow{grid-template-columns:28px 40px 1fr 36px}
.qrow .art{width:40px;height:40px}
.handle{color:var(--fg3);cursor:grab;touch-action:none;display:grid;place-items:center;height:40px}
.qrow.drag{background:var(--bg3);box-shadow:var(--shadow);position:relative;z-index:2;transition:none}
.qlbl{font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.14em;padding:12px 8px 4px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translate(-50%,20px);background:var(--bg3);color:var(--fg);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--fg2)}
.kbd kbd{font-family:var(--f-display);background:var(--bg4);color:var(--fg);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;justify-self:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:599px){.top{flex-wrap:wrap;row-gap:10px}.brand{flex:1}.search{order:5;flex:1 0 100%}}

.mix>span{display:block;color:var(--fg2);font-size:12.5px;margin-top:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mix>small{display:block;color:var(--fg3);font-size:11.5px;margin-top:2px}
.rng{margin:0 0 8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rng::-webkit-scrollbar{display:none}
.rng .chip{flex:none}
.row.rkd{grid-template-columns:22px 48px 1fr auto 36px}
.rk{font-family:var(--f-display);font-weight:700;color:var(--fg3);text-align:center;font-size:15px}
.pad{padding:8px 4px}
.center{text-align:center;margin-top:26px}
.hint svg{width:13px;height:13px;vertical-align:-2px}
</style>
</head>

<!-- Sponsor strip. Same markup as KodeX: the KodeX Master Editor ("Free + sponsors") can put
     banners in #topAdSlot. Until then muSync shows its built-in MEIOCG banners (musync-house-ads). -->
<div id="topAdSafeArea" class="top-ad-safe-area" aria-label="Sponsor"><div id="topAdSlot" class="top-ad-slot"><span>ADVERTISEMENT</span></div></div>
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo" role="img" aria-label="MEIOCG"></div><span class="wm">muSync</span></div>
    <label class="search" id="searchBox"><svg class="i"><use href="#i-search"/></svg><span class="sr">Search</span><input id="q" type="search" placeholder="Search songs, artists, albums" autocomplete="off" enterkeyhint="search"><button class="clr" id="qClr" type="button" aria-label="Clear search"><svg class="i"><use href="#i-x"/></svg></button></label>
    <button class="ib" id="addBtn" aria-label="Add music"><svg class="i"><use href="#i-plus"/></svg></button>
    <button class="ib" id="setBtn" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Library">
    <button class="tab" role="tab" data-tab="home">Home</button>
    <button class="tab" role="tab" data-tab="songs">Songs</button>
    <button class="tab" role="tab" data-tab="albums">Albums</button>
    <button class="tab" role="tab" data-tab="artists">Artists</button>
    <button class="tab" role="tab" data-tab="playlists">Playlists</button>
    <button class="tab" role="tab" data-tab="favorites">Favorites</button>
  </nav>
  <main id="view" tabindex="-1"></main>
  <div class="mini" id="mini" role="button" tabindex="0" aria-label="Open now playing">
    <div class="art" id="miniArt"></div>
    <div class="m"><div class="t" id="miniT"></div><div class="a" id="miniA"></div></div>
    <button class="ib" id="miniPrev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
    <button class="playb" id="miniPlay" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
    <button class="ib" id="miniNext" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
    <div class="pb"><i id="miniPb"></i></div>
  </div>
</div>

<section class="np" id="np" aria-label="Now playing" aria-hidden="true">
  <div class="bgart" id="npBg"></div>
  <div class="in">
    <div class="nph">
      <button class="ib" id="npClose" aria-label="Close now playing"><svg class="i"><use href="#i-down"/></svg></button>
      <div class="lbl"><span class="brand">muSync</span><span id="npCtx">Now playing</span></div>
      <button class="ib" id="npMore" aria-label="More options"><svg class="i"><use href="#i-more"/></svg></button>
    </div>
    <div class="npart"><div class="art" id="npArt"></div><canvas id="viz"></canvas></div>
    <div class="npt">
      <div class="m"><h2 id="npT">Not playing</h2><p id="npA"></p></div>
      <button class="ib fav" id="npFav" aria-label="Favorite"><svg class="i"><use href="#i-heart-o"/></svg></button>
    </div>
    <div class="seek"><input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Seek"><div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div></div>
    <div class="ctr">
      <button class="ib" id="shufBtn" aria-label="Shuffle" aria-pressed="false"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="ib" id="prevBtn" aria-label="Previous"><svg class="i" style="width:30px;height:30px"><use href="#i-prev"/></svg></button>
      <button class="bigplay" id="playBtn" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="ib" id="nextBtn" aria-label="Next"><svg class="i" style="width:30px;height:30px"><use href="#i-next"/></svg></button>
      <button class="ib" id="repBtn" aria-label="Repeat: off"><svg class="i"><use href="#i-repeat"/></svg><span class="badge" id="repBadge"></span></button>
    </div>
    <div class="vol">
      <button class="ib" id="muteBtn" aria-label="Mute"><svg class="i"><use href="#i-vol"/></svg></button>
      <input type="range" id="volR" min="0" max="100" step="1" aria-label="Volume">
    </div>
    <div class="npx">
      <button id="soundBtn"><svg class="i"><use href="#i-eq"/></svg><span id="soundLbl">Sound</span></button>
      <button id="queueBtn"><svg class="i"><use href="#i-queue"/></svg><span>Queue</span></button>
      <button id="sleepBtn"><svg class="i"><use href="#i-moon"/></svg><span id="sleepLbl">Sleep</span></button>
      <button id="speedBtn"><svg class="i"><use href="#i-speed"/></svg><span id="speedLbl">1×</span></button>
    </div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <div class="grab"></div>
  <div class="sh"><h3 id="sheetT"></h3><button class="ib" id="sheetX" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sb" id="sheetB"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop" id="drop">Drop music to add</div>
<input type="file" id="fileIn" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.oga,.opus,.wav,.weba,.webm,.mp4" hidden>
<input type="file" id="dirIn" multiple webkitdirectory hidden>
<audio id="audio" preload="auto" playsinline></audio>

<script>
'use strict';
(() => {
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = t => { if (!isFinite(t) || t < 0) t = 0; t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const icon = (n, cls = 'i') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const AUDIO_EXT = /\.(mp3|m4a|m4b|aac|flac|ogg|oga|opus|wav|wave|weba|webm|mp4|aif|aiff|alac|wma|amr|3gp|mka)$/i;
// Android pickers sometimes give odd names/types; let the decoder decide unless it's clearly not audio.
const isAudio = f => { const n = f.name || '', t = f.type || ''; if (t.startsWith('audio/') || AUDIO_EXT.test(n)) return true; if (/^(image|text|font)\//.test(t) || /^application\/(pdf|zip|json|x-zip)/.test(t)) return false; return !/\.[a-z0-9]{2,5}$/i.test(n) || t === '' || t === 'application/octet-stream' || /^video\/(mp4|webm|ogg|3gpp)/.test(t); };
const UA = navigator.userAgent || '';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const NATIVE = (() => { try { return !!(window.CastelMedia && typeof window.CastelMedia.available === 'function' && window.CastelMedia.available()); } catch { return false; } })();
const CAN_PICK_FOLDER = !MOBILE && 'webkitdirectory' in document.createElement('input');
const CAN_WATCH_FOLDER = !NATIVE && !MOBILE && typeof window.showDirectoryPicker === 'function';
const coll = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });

let toastT;
function toast(msg, ms = 2400) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms); }

/* ================= IndexedDB ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
      let r; try { r = indexedDB.open('pulse-player', 2); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; for (const n of ['tracks', 'blobs', 'art', 'thumbs', 'kv']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { this.db.close(); this.db = null; }; res(); };
      r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('DB closed'));
      let tx; try { tx = this.db.transaction(store, mode); } catch (e) { return rej(e); }
      let out; const q = fn(tx.objectStore(store));
      if (q) q.onsuccess = () => { out = q.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
  },
  get(store, k) { return this.req(store, 'readonly', s => s.get(k)); },
  all(store) { return this.req(store, 'readonly', s => s.getAll()); },
  putTrack(meta) { return this.req('tracks', 'readwrite', s => s.put(meta, meta.id)); },
  putTracks(list) { return this.req('tracks', 'readwrite', s => { for (const m of list) s.put(m, m.id); }); },
  kvGet(k) { return this.req('kv', 'readonly', s => s.get(k)); },
  kvSet(k, v) { return this.req('kv', 'readwrite', s => s.put(v, k)); },
  kvDel(k) { return this.req('kv', 'readwrite', s => s.delete(k)); },
  addFull(meta, blob, art, thumb) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('DB closed'));
      let tx; try { tx = this.db.transaction(['tracks', 'blobs', 'art', 'thumbs'], 'readwrite'); } catch (e) { return rej(e); }
      tx.objectStore('blobs').put(blob, meta.id);
      if (art) tx.objectStore('art').put(art, meta.id);
      if (thumb) tx.objectStore('thumbs').put(thumb, meta.id);
      tx.objectStore('tracks').put(meta, meta.id);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
  },
  del(id) {
    return new Promise((res, rej) => {
      if (!this.db) return res();
      const tx = this.db.transaction(['tracks', 'blobs', 'art', 'thumbs'], 'readwrite');
      for (const n of ['tracks', 'blobs', 'art', 'thumbs']) tx.objectStore(n).delete(id);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  clear() {
    return new Promise((res, rej) => {
      if (!this.db) return res();
      const tx = this.db.transaction(['tracks', 'blobs', 'art', 'thumbs'], 'readwrite');
      for (const n of ['tracks', 'blobs', 'art', 'thumbs']) tx.objectStore(n).clear();
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
};

/* ================= Tag parsing (ID3v2.2-2.4, FLAC, MP4/M4A) ================= */
const Tags = {
  dec(bytes, enc) {
    try {
      let label = 'windows-1252';
      if (enc === 1) { label = 'utf-16le'; if (bytes[0] === 0xFE && bytes[1] === 0xFF) { label = 'utf-16be'; bytes = bytes.subarray(2); } else if (bytes[0] === 0xFF && bytes[1] === 0xFE) bytes = bytes.subarray(2); }
      else if (enc === 2) label = 'utf-16be'; else if (enc === 3) label = 'utf-8';
      return new TextDecoder(label).decode(bytes).replace(/\u0000+$/g, '').split('\u0000')[0].trim();
    } catch { return ''; }
  },
  ss: (b, o) => ((b[o] & 0x7f) << 21) | ((b[o + 1] & 0x7f) << 14) | ((b[o + 2] & 0x7f) << 7) | (b[o + 3] & 0x7f),
  be32: (b, o) => ((b[o] << 24) >>> 0) + (b[o + 1] << 16) + (b[o + 2] << 8) + b[o + 3],
  deunsync(b) { const out = new Uint8Array(b.length); let j = 0; for (let i = 0; i < b.length; i++) { out[j++] = b[i]; if (b[i] === 0xFF && b[i + 1] === 0x00) i++; } return out.subarray(0, j); },
  termLen(b, start, enc) { // index of end of null-terminated string
    if (enc === 1 || enc === 2) { for (let i = start; i + 1 < b.length; i += 2) if (b[i] === 0 && b[i + 1] === 0) return i; return b.length; }
    const i = b.indexOf(0, start); return i < 0 ? b.length : i;
  },
  async read(file) {
    const r = {};
    try {
      const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
      const s4 = String.fromCharCode(...head.subarray(0, 4));
      if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) await this.id3(file, head, r);
      else if (s4 === 'fLaC') await this.flac(file, r);
      else if (String.fromCharCode(...head.subarray(4, 8)) === 'ftyp') await this.mp4(file, r);
    } catch (e) { console.warn('tag parse', file.name, e); }
    return r;
  },
  async id3(file, head, r) {
    const ver = head[3], flags = head[5], size = this.ss(head, 6);
    if (ver < 2 || ver > 4 || size <= 0 || size > 64 * 1024 * 1024) return;
    let b = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
    if ((flags & 0x80) && ver < 4) b = this.deunsync(b);
    let p = 0;
    if ((flags & 0x40) && ver >= 3) p = ver === 4 ? this.ss(b, 0) : this.be32(b, 0) + 4;
    const v2 = ver === 2, hl = v2 ? 6 : 10, map = v2 ? { TT2: 'title', TP1: 'artist', TAL: 'album', TP2: 'albumArtist', TRK: 'track', TYE: 'year', TCO: 'genre' } : { TIT2: 'title', TPE1: 'artist', TALB: 'album', TPE2: 'albumArtist', TRCK: 'track', TYER: 'year', TDRC: 'year', TCON: 'genre' };
    while (p + hl <= b.length) {
      const id = String.fromCharCode(...b.subarray(p, p + (v2 ? 3 : 4)));
      if (!/^[A-Z0-9]{3,4}$/.test(id)) break;

      const fflags = v2 ? 0 : b[p + 9];
      if (fsz <= 0 || p + hl + fsz > b.length) break;
      let body = b.subarray(p + hl, p + hl + fsz);
      p += hl + fsz;
      if (ver === 4) { if (fflags & 0x01) body = body.subarray(4); if (fflags & 0x02) body = this.deunsync(body); if (fflags & 0x0C) continue; }
      if (ver === 3 && (fflags & 0xC0)) continue; // compressed/encrypted
      if (map[id] && !r[map[id]]) { const v = this.dec(body.subarray(1), body[0]); if (v) r[map[id]] = v; }
      else if ((id === 'APIC' || id === 'PIC') && !r.pic) {
        const enc = body[0]; let i = 1, mime;

  },

// In desktop Chrome/Edge: remember a music folder and pick up new songs from it on every launch.
async function watchFolder() {
  let h; try { h = await window.showDirectoryPicker({ id: 'pulse-music', mode: 'read' }); } catch { return; }

async function scanFolder(h, silent) {
  const out = [];

  if (!silent) toast('Scanning folder…', 60000);
  try { await walk(h, 0); } catch (e) { if (!silent) toast("Couldn't read that folder"); return; }
  const sigs = new Set([...S.tracks.values()].map(t => t.sig));
  const fresh = out.filter(f => !sigs.has(`${f.name}|${f.size}|${f.lastModified || 0}`));
  if (fresh.length) importFiles(fresh, { quiet: silent });

}
async function rescanFolder(fromGesture) {
  let h; try { h = await DB.kvGet('folder'); } catch {} if (!h) return false;
  try {
    let p = await h.queryPermission({ mode: 'read' });
    if (p !== 'granted' && fromGesture) p = await h.requestPermission({ mode: 'read' });

  } catch {}

}

/* ================= Import ================= */
let importing = false; const importQ = [];
async function importFiles(fileList, { quiet = false } = {}) {
  const files = [...fileList].filter(isAudio);
  const skipped = fileList.length - files.length;
  if (!files.length) { if (!quiet) toast(skipped ? 'No audio files found' : 'Nothing selected'); return; }
  importQ.push(...files); if (importing) return; importing = true;
  const sigs = new Set([...S.tracks.values()].map(t => t.sig));
  let added = 0, dup = 0, fail = 0, vol = 0, done = 0;
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    while (importQ.length) {
      const f = importQ.shift(); done++;
      if (!quiet || done === 1) toast(`Adding music… ${done}/${done + importQ.length}`, 60000);
      const sig = `${f.name}|${f.size}|${f.lastModified || 0}`;
      if (sigs.has(sig)) { dup++; continue; }
      try {
        const dur = await probeDuration(f);
        if (dur < 0) { fail++; continue; }
        const tg = await Tags.read(f); const fn = fromName(f.name);
        let art = null, thumb = null;
        if (tg.pic && tg.pic.size > 0) { thumb = await makeThumb(tg.pic); if (thumb) art = tg.pic.size > 2.5e6 ? await makeThumb(tg.pic, 900) || thumb : tg.pic; }
        const id = uid();
        const meta = { id, sig, name: f.name, title: tg.title || fn.title || f.name, artist: tg.artist || fn.artist || '', album: tg.album || '', albumArtist: tg.albumArtist || '', year: tg.year || '', genre: tg.genre || '', trackNo: parseInt(tg.track) || 0, duration: dur, size: f.size, mime: f.type || '', added: Date.now() + done, art: !!thumb, plays: 0 };
        const blob = f.slice(0, f.size, f.type || 'audio/mpeg');
        let saved = false;
        if (DB.db) { try { await DB.addFull(meta, blob, art, thumb); saved = true; } catch (e) { console.warn('persist failed', e); } }
        if (!saved) { S.mem.set(id, f); meta._thumb = thumb; meta._art = art; vol++; }
        S.tracks.set(id, meta); sigs.add(sig); added++;
        if (added % 10 === 0) render();
      } catch (e) { console.warn('import', f.name, e); fail++; }
    }
  } finally { importing = false; }
  render();
  const parts = [];
  if (added) parts.push(`Added ${added} song${added > 1 ? 's' : ''}`);
  if (dup) parts.push(`${dup} already in library`);
  if (fail) parts.push(`${fail} couldn't be read`);
  toast(parts.join(' · ') || 'Nothing added', 3500);
  if (vol) setTimeout(() => toast(`Storage is full: ${vol} song${vol > 1 ? 's' : ''} will only stay until the app closes`, 5000), 3600);
  if (added && !S.cur) { const first = sortedLib()[0]; if (first) { S.queue = sortedLib().map(t => t.id); S.orig = S.queue.slice(); S.qi = S.queue.indexOf(first.id); S.ctxName = 'Songs'; loadTrack(first.id, { autoplay: false }); } }
}

/* ================= Listening history & stats (stays on this device) =================

  async load() {

  day(ts) { const k = this.key(ts); return this.d.days[k] || (this.d.days[k] = { ms: 0, n: 0, sk: 0, h: Array(24).fill(0), t: {} }); },
  ent(day, id) { return day.t[id] || (day.t[id] = [0, 0, 0]); }, // [plays, ms, skips]

  // Called on every time update, play, pause and song change.

  end() {

  top(r, n = 10) { return [...r.t].filter(([id, e]) => e[0] > 0 && S.tracks.has(id)).sort((a, b) => b[1][0] - a[1][0] || b[1][1] - a[1][1]).slice(0, n).map(([id, e]) => ({ t: S.tracks.get(id), plays: e[0], ms: e[1] })); },
  topBy(r, kind, n = 10) {

  recent(n = 20) { const seen = new Set(), out = []; for (const r of this.d.recent) { if (seen.has(r.id) || !S.tracks.has(r.id)) continue; seen.add(r.id); out.push(r.id); if (out.length >= n) break; } return out; },
  lastPlayedMap() { const m = new Map(); for (const [k, d] of Object.entries(this.d.days)) for (const [id, e] of Object.entries(d.t)) if (e[0] && (!m.has(id) || m.get(id) < k)) m.set(id, k); return m; },
  streaks() {

  // Bars for the activity chart: days for short ranges, weeks for 6 months, months for longer.
  series(r) {

const fmtListen = ms => { const m = Math.round(ms / 60000); if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r && h < 100 ? `${h} hr ${r} min` : `${h.toLocaleString()} hr`; };
const plays = n => `${n.toLocaleString()} play${n === 1 ? '' : 's'}`;
const hourName = h => h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
const partOfDay = h => h < 5 ? 'Late nights' : h < 12 ? 'Mornings' : h < 17 ? 'Afternoons' : h < 21 ? 'Evenings' : 'Nights';

/* Smart playlists built from your history, like Spotify's made-for-you mixes. */
const MIXES = {
  onrepeat: ['On Repeat', 'Songs you can’t stop playing lately', 'linear-gradient(140deg,#7088ff,#a988ef)'],
  recent: ['Recently Played', 'Pick up where you left off', 'linear-gradient(140deg,#3fd3a2,#7088ff)'],
  rewind: ['Repeat Rewind', 'Your favorites from a few months ago', 'linear-gradient(140deg,#a988ef,#f39350)'],
  forgotten: ['Forgotten Gems', 'Loved before, not played lately', 'linear-gradient(140deg,#f0b429,#f39350)'],
  fresh: ['Never Played', 'Songs you haven’t heard here yet', 'linear-gradient(140deg,#e0566b,#a988ef)'],
  recentadd: ['Recently Added', 'The newest songs in your library', 'linear-gradient(140deg,#7088ff,#3fd3a2)'],
  top: ['Your Top Songs', '', 'linear-gradient(140deg,#f39350,#e0566b)']
};
function mixList(k) {
  const all = [...S.tracks.values()];
  if (k === 'recent') return H.recent(50).map(id => S.tracks.get(id));
  if (k === 'recentadd') return all.slice().sort((a, b) => (b.added || 0) - (a.added || 0)).slice(0, 50);
  if (k === 'top') return H.top(H.range(S.set.statRange || '4w'), 50).map(x => x.t);
  if (k === 'onrepeat') return H.top(H.range('4w'), 30).map(x => x.t);
  const lp = H.lastPlayedMap(), recentCut = H.key(Date.now() - 30 * DAY);
  if (k === 'rewind') {
    const old = H.range('6m'), recentIds = new Set([...H.range('4w').t].filter(([, e]) => e[0]).map(([id]) => id));
    return H.top(old, 200).filter(x => !recentIds.has(x.t.id)).slice(0, 30).map(x => x.t);
  }
  if (k === 'forgotten') {
    const ever = H.range('all');
    return all.filter(t => (S.favs.has(t.id) || ((ever.t.get(t.id) || [0])[0] >= 3)) && !((lp.get(t.id) || '') >= recentCut))
      .sort((a, b) => ((ever.t.get(b.id) || [0])[0] - (ever.t.get(a.id) || [0])[0]) || coll.compare(a.title, b.title)).slice(0, 40);
  }
  if (k === 'fresh') { const ever = H.range('all'); return all.filter(t => !((ever.t.get(t.id) || [0])[0]) && !t.plays).sort((a, b) => (b.added || 0) - (a.added || 0)).slice(0, 100); }

}

function rangeChips(cur) { return `<div class="chips rng" role="tablist" aria-label="Time range">${RANGES.map(([k, l]) => `<button class="chip${k === cur ? ' on' : ''}" data-act="range" data-r="${k}" role="tab" aria-selected="${k === cur}">${l}</button>`).join('')}</div>`; }
function secHead(title, act, label = 'See all', attrs = '') { return `<div class="hsec"><h3>${esc(title)}</h3>${act ? `<button class="lnk" data-act="${act}" ${attrs}>${esc(label)}</button>` : ''}</div>`; }
function mixCard(k, list) { const [name, sub, bg] = MIXES[k]; return `<div class="mix" data-act="mix" data-key="${k}" tabindex="0" role="button" aria-label="${esc(name)}"><div class="mixart" style="background:${bg}">${icon(k === 'recent' ? 'history' : k === 'recentadd' ? 'plus' : k === 'fresh' ? 'spark' : k === 'forgotten' ? 'heart-o' : k === 'rewind' ? 'repeat' : 'flame')}<b>${esc(name)}</b></div><span>${esc(sub || '')}</span><small>${list.length} song${list.length === 1 ? '' : 's'}</small></div>`; }
function tileHTML(attrs, artId, name, bg, ico) { return `<div class="tile" ${attrs} tabindex="0" role="button">${artId ? artHTML(artId) : `<div class="art" style="background:${bg};color:#fff;border:0">${icon(ico)}</div>`}<b>${esc(name)}</b></div>`; }
function trackCard(t, list, i) { return `<div class="hcard" data-act="playin" data-l="${list}" data-i="${i}" tabindex="0" role="button" aria-label="Play ${esc(t.title)}">${artHTML(t.id)}<b>${esc(t.title)}</b><span>${esc(t.artist || 'Unknown artist')}</span></div>`; }

function homeHTML() {
  S.homeLists = {};
  const hr = new Date().getHours(), greet = hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const wk = H.range('7d'), ever = H.range('all'), rk = S.set.statRange || '4w', rng = H.range(rk), st = H.streaks();
  let h = `<div class="home"><div class="hh"><div class="m"><h2>${greet}</h2><p>${S.tracks.size.toLocaleString()} songs${ever.ms >= 60000 ? ` · ${fmtListen(ever.ms)} listened` : ''}${S.set.privateSession ? ' · Private session' : ''}</p></div><button class="ib" data-act="stats" aria-label="Your stats">${icon('chart')}</button></div>`;
  // Quick tiles, like Spotify's home grid
  const pls = S.playlists.filter(p => p.ids.some(id => S.tracks.has(id))).slice(0, 2);
  const tiles = [
    tileHTML('data-act="tab" data-tab="favorites"', null, 'Favorites', 'linear-gradient(140deg,var(--acc),var(--acc2))', 'heart'),
    tileHTML('data-act="mix" data-key="onrepeat"', null, 'On Repeat', MIXES.onrepeat[2], 'flame'),
    tileHTML('data-act="mix" data-key="recent"', null, 'Recently Played', MIXES.recent[2], 'history'),
    tileHTML('data-act="mix" data-key="recentadd"', null, 'Recently Added', MIXES.recentadd[2], 'plus'),
    ...pls.map(p => { const a = p.ids.map(id => S.tracks.get(id)).find(t => t && t.art); return tileHTML(`data-act="open" data-type="playlist" data-key="${esc(p.id)}"`, a ? a.id : null, p.name, 'var(--bg3)', 'list'); })
  ];
  while (tiles.length < 6) tiles.push(tiles.length === 4 ? tileHTML('data-act="tab" data-tab="albums"', null, 'Albums', 'linear-gradient(140deg,#f39350,#f0b429)', 'album') : tileHTML('data-act="tab" data-tab="songs"', null, 'All Songs', 'linear-gradient(140deg,#3fd3a2,#7088ff)', 'note'));
  h += `<div class="tiles">${tiles.join('')}</div>`;
  // Continue listening
  const cur = curTrack();
  if (cur) h += `<div class="cont" data-cur="${esc(cur.id)}" data-act="opennp" tabindex="0" role="button" aria-label="Open the player">${artHTML(cur.id)}<div class="m"><small>${audio.paused ? 'Continue listening' : 'Now playing'}</small><b>${esc(cur.title)}</b><span>${esc(cur.artist || 'Unknown artist')}</span></div><button class="pbtn" data-act="toggle" aria-label="${audio.paused ? 'Play' : 'Pause'}">${icon(audio.paused ? 'play' : 'pause')}</button></div>`;
  // This week
  const ta = H.topBy(wk, 'artist', 1)[0];
  h += secHead('Your week', 'stats', 'All stats');
  h += `<div class="stg"><div class="stat"><small>Listening time</small><b>${fmtListen(wk.ms)}</b></div><div class="stat"><small>Songs played</small><b>${wk.n.toLocaleString()}</b></div><div class="stat"><small>Top artist</small><b class="one">${ta ? esc(ta.name) : '—'}</b></div><div class="stat"><small>Day streak</small><b>${st.cur} day${st.cur === 1 ? '' : 's'}</b></div></div>`;
  h += `<div class="card2">${chartHTML(H.series(wk), 'Listening time, last 7 days')}</div>`;
  // Recently played
  const rec = H.recent(15); S.homeLists.recent = rec;
  if (rec.length) h += secHead('Recently played', 'mix', 'See all', 'data-key="recent"') + `<div class="hrow">${rec.map((id, i) => trackCard(S.tracks.get(id), 'recent', i)).join('')}</div>`;
  // Top songs with range
  const top = H.top(rng, 5);
  h += secHead('Your top songs', 'mix', 'See all', 'data-key="top"') + rangeChips(rk);
  if (top.length) { S.viewList = top.map(x => x.t.id); S.ctxLabel = 'Your top songs'; h += top.map((x, i) => rowHTML(x.t, i, { d: plays(x.plays), rank: i + 1 })).join(''); }
  else { S.viewList = []; h += `<p class="hint pad">Play some music — your most played songs ${rk === 'all' ? '' : RANGES.find(r => r[0] === rk)[1].toLowerCase() + ' '}show up here.</p>`; }
  // Top artists
  const tas = H.topBy(rng, 'artist', 10);
  if (tas.length) h += secHead('Top artists') + `<div class="hrow">${tas.map(g => `<div class="acard" data-act="open" data-type="artist" data-key="${esc(g.key)}" tabindex="0" role="button">${artHTML(g.art || g.first).replace('class="art"', 'class="art round"')}<b>${esc(g.name)}</b><span>${plays(g.plays)}</span></div>`).join('')}</div>`;
  // Mixes
  const mixes = ['onrepeat', 'rewind', 'forgotten', 'fresh', 'recentadd'].map(k => [k, mixList(k)]).filter(([, l]) => l.length);
  if (mixes.length) h += secHead('Made for you') + `<div class="hrow">${mixes.map(([k, l]) => mixCard(k, l)).join('')}</div>`;
  // Jump back in: albums from recent listening
  const albums = []; const seenA = new Set();
  for (const id of H.recent(60)) { const t = S.tracks.get(id); const k = (t.album || '').trim().toLowerCase(); if (!k || seenA.has(k)) continue; seenA.add(k); albums.push(t); if (albums.length >= 10) break; }
  if (albums.length) h += secHead('Jump back in', 'tab', 'Albums', 'data-tab="albums"') + `<div class="hrow">${albums.map(t => `<div class="hcard" data-act="open" data-type="album" data-key="${esc((t.album || '').trim().toLowerCase())}" tabindex="0" role="button">${artHTML(t.id)}<b>${esc(t.album)}</b><span>${esc(t.artist || '')}</span></div>`).join('')}</div>`;
  h += `<p class="hint pad center">${icon('lock')} Your listening history stays on this device.</p></div>`;
  return h;
}

function statsHTML() {
  const rk = S.set.statRange || '4w', r = H.range(rk), st = H.streaks(), label = RANGES.find(x => x[0] === rk)[1];
  const daysIn = r.from ? Math.max(1, Math.round((Date.now() - r.from) / DAY)) : Math.max(1, r.days.size);
  const uniq = [...r.t.values()].filter(e => e[0]).length;
  const artists = H.topBy(r, 'artist', 10), albums = H.topBy(r, 'album', 6), top = H.top(r, 10);
  const uA = H.topBy(r, 'artist', 9999).length;
  const bh = r.h.indexOf(Math.max(...r.h)), bd = r.dow.indexOf(Math.max(...r.dow));
  const dname = new Date(2024, 0, 7 + bd).toLocaleDateString(undefined, { weekday: 'long' });
  const tries = r.n + r.sk, skip = tries ? Math.round(r.sk / tries * 100) : 0;
  let h = `<div class="lh"><button class="ib" data-act="back" aria-label="Back">${icon('back')}</button><h2>Your stats</h2><div class="sub">${S.set.privateSession ? 'Private session is on: new listening isn’t being counted' : 'Counted on this device only'}</div></div>`;
  h += rangeChips(rk);
  h += `<div class="stg big"><div class="stat hero"><small>${esc(label)}</small><b>${fmtListen(r.ms)}</b><span>${(r.ms / 60000).toLocaleString(undefined, { maximumFractionDigits: 0 })} minutes listened</span></div>
    <div class="stat"><small>Songs played</small><b>${r.n.toLocaleString()}</b></div>
    <div class="stat"><small>Different songs</small><b>${uniq.toLocaleString()}</b></div>
    <div class="stat"><small>Different artists</small><b>${uA.toLocaleString()}</b></div>
    <div class="stat"><small>Daily average</small><b>${fmtListen(r.ms / daysIn)}</b></div>
    <div class="stat"><small>Current streak</small><b>${st.cur} day${st.cur === 1 ? '' : 's'}</b></div>
    <div class="stat"><small>Longest streak</small><b>${st.best} day${st.best === 1 ? '' : 's'}</b></div>
    <div class="stat"><small>Skip rate</small><b>${tries ? skip + '%' : '—'}</b></div>
    <div class="stat"><small>Favorite time</small><b class="one">${r.ms ? partOfDay(bh) : '—'}</b>${r.ms ? `<span>Most around ${hourName(bh)}</span>` : ''}</div>
    <div class="stat"><small>Favorite day</small><b class="one">${r.ms ? esc(dname) : '—'}</b></div></div>`;
  h += secHead('Listening activity') + `<div class="card2">${chartHTML(H.series(r), 'Listening activity')}</div>`;
  h += secHead('Time of day') + `<div class="card2">${chartHTML(r.h.map((ms, i) => ({ ms, label: i % 6 === 0 ? hourName(i) : '', title: hourName(i) })), 'Listening by hour of day')}</div>`;
  h += secHead('Top songs', top.length ? 'mix' : '', 'Play all', 'data-key="top"');
  if (top.length) { S.viewList = top.map(x => x.t.id); S.ctxLabel = 'Your top songs'; h += top.map((x, i) => rowHTML(x.t, i, { d: plays(x.plays), rank: i + 1 })).join(''); }
  else { S.viewList = []; h += `<p class="hint pad">Nothing yet for ${esc(label.toLowerCase())}.</p>`; }
  if (artists.length) h += secHead('Top artists') + artists.map((g, i) => `<div class="row" style="grid-template-columns:22px 48px 1fr auto" data-act="open" data-type="artist" data-key="${esc(g.key)}" tabindex="0" role="button"><span class="rk">${i + 1}</span>${artHTML(g.art || g.first).replace('class="art"', 'class="art round"')}<div class="m"><div class="t">${esc(g.name)}</div><div class="a">${fmtListen(g.ms)}</div></div><span class="d">${plays(g.plays)}</span></div>`).join('');
  if (albums.length) h += secHead('Top albums') + `<div class="hrow">${albums.map(g => `<div class="hcard" data-act="open" data-type="album" data-key="${esc(g.key)}" tabindex="0" role="button">${artHTML(g.art || g.first)}<b>${esc(g.name)}</b><span>${plays(g.plays)}</span></div>`).join('')}</div>`;
  h += `<div class="card2 opts"><div class="srow"><div><b>Private session</b><br><small>Pause your listening history. New listening won’t count toward stats.</small></div><label class="sw"><input type="checkbox" data-act="private" ${S.set.privateSession ? 'checked' : ''} aria-label="Private session"><i></i></label></div>
    <div class="srow"><div><b>Listening history</b><br><small>Since ${new Date(H.d.since || Date.now()).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })} · stays on this device</small></div><button class="btn dan" data-act="clearhist">Clear</button></div></div>`;
  return h;
}

function render() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.view.tab && !S.q)));
  const scrollKey = S.view.tab + (S.view.detail ? JSON.stringify(S.view.detail) : '');
  const keepScroll = render._k === scrollKey ? view.scrollTop : 0; render._k = scrollKey;
  let h = '';
  const q = S.q.trim().toLowerCase();
  if (!S.tracks.size && S.view.tab !== 'playlists' && !(S.view.detail && S.view.detail.type === 'stats')) h = emptyLib();
  else if (q) {
    const list = sortedLib().filter(t => matches(t, q));
    h = `<div class="lh"><h2>Results</h2>${list.length ? `<button class="btn pri" data-act="playall">${icon('play')}Play</button>` : ''}<div class="sub">${list.length} song${list.length === 1 ? '' : 's'} for “${esc(S.q.trim())}”</div></div>` + (list.length ? listHTML(list) : emptyMsg('No matches', 'Try a different word.'));
  } else {
    const d = S.view.detail, tab = S.view.tab;
    if (d && d.type === 'stats') { h = statsHTML(); }
    else if (d && d.type === 'mix' && MIXES[d.key]) {
      const [name, sub] = MIXES[d.key]; const list = mixList(d.key).filter(Boolean);
      const sub2 = d.key === 'top' ? RANGES.find(r => r[0] === (S.set.statRange || '4w'))[1] : sub;
      h = `<div class="lh"><button class="ib" data-act="back" aria-label="Back">${icon('back')}</button><h2>${esc(name)}</h2><div class="sub">${esc(sub2)} · ${subOf(list)}</div></div>`;
      if (list.length) {
        const pc = d.key === 'top' || d.key === 'onrepeat' ? H.range(d.key === 'top' ? (S.set.statRange || '4w') : '4w') : null;
        S.viewList = list.map(t => t.id);
        h += `<div class="lh" style="padding-top:0"><button class="btn pri" data-act="playall">${icon('play')}Play</button><button class="btn" data-act="shuffleall">${icon('shuffle')}Shuffle</button></div>` + list.map((t, i) => rowHTML(t, i, pc ? { d: plays((pc.t.get(t.id) || [0])[0]), rank: i + 1 } : {})).join('');
      } else { S.viewList = []; h += emptyMsg('Nothing here yet', d.key === 'fresh' ? 'You’ve played every song in your library. Nice!' : 'Keep listening — this mix fills up as you play music.'); }
      S.ctxLabel = name;
    } else if (d) {
      const back = `<button class="ib" data-act="back" aria-label="Back">${icon('back')}</button>`;
      let list = [], title = '', extra = '';
      if (d.type === 'album') { const g = groups('album').find(g => g.key === d.key); list = g ? sortAlbum(g.list) : []; title = g ? g.name : 'Album'; }
      else if (d.type === 'artist') { const g = groups('artist').find(g => g.key === d.key); list = g ? g.list.slice().sort((a, b) => coll.compare(a.album || '', b.album || '') || (a.trackNo || 0) - (b.trackNo || 0) || coll.compare(a.title, b.title)) : []; title = g ? g.name : 'Artist'; }
      else if (d.type === 'playlist') { const p = S.playlists.find(p => p.id === d.key); if (!p) { S.view.detail = null; return render(); } list = p.ids.map(id => S.tracks.get(id)).filter(Boolean); title = p.name; extra = `<button class="ib" data-act="plmenu" aria-label="Playlist options">${icon('more')}</button>`; }
      h = `<div class="lh">${back}<h2>${esc(title)}</h2>${extra}<div class="sub">${subOf(list)}</div></div>`;
      if (list.length) h += `<div class="lh" style="padding-top:0"><button class="btn pri" data-act="playall">${icon('play')}Play</button><button class="btn" data-act="shuffleall">${icon('shuffle')}Shuffle</button></div>` + listHTML(list);
      else h += emptyMsg('Nothing here yet', d.type === 'playlist' ? 'Use “Add to playlist” from any song’s menu.' : '');
      S.ctxLabel = title;
    } else if (tab === 'home') {
      h = homeHTML();
    } else if (tab === 'songs') {
      const list = sortedLib();
      const sel = `<select class="sel" data-act="sort" aria-label="Sort by">${[['added', 'Recently added'], ['title', 'Title'], ['artist', 'Artist'], ['album', 'Album'], ['duration', 'Duration'], ['plays', 'Most played']].map(([v, l]) => `<option value="${v}"${S.set.sort === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
      h = headHTML('Songs', subOf(list), list, sel) + listHTML(list); S.ctxLabel = 'Songs';
    } else if (tab === 'albums') {
      const gs = groups('album');
      h = `<div class="lh"><h2>Albums</h2><div class="sub">${gs.length} album${gs.length === 1 ? '' : 's'}</div></div><div class="grid">` + gs.map(g => { const a = g.list.find(t => t.art) || g.list[0]; return `<div class="card" data-act="open" data-type="album" data-key="${esc(g.key)}" tabindex="0" role="button">${artHTML(a.id)}<b>${esc(g.name)}</b><span>${esc(g.artists.size > 1 ? 'Various artists' : [...g.artists][0] || 'Unknown artist')} · ${g.list.length}</span></div>`; }).join('') + '</div>';
      S.viewList = [];
    } else if (tab === 'artists') {
      const gs = groups('artist');
      h = `<div class="lh"><h2>Artists</h2><div class="sub">${gs.length} artist${gs.length === 1 ? '' : 's'}</div></div>` + gs.map(g => { const a = g.list.find(t => t.art) || g.list[0]; return `<div class="row" style="grid-template-columns:48px 1fr auto" data-act="open" data-type="artist" data-key="${esc(g.key)}" tabindex="0" role="button">${artHTML(a.id).replace('class="art"', 'class="art" style="border-radius:50%"')}<div class="m"><div class="t">${esc(g.name)}</div><div class="a">${g.list.length} song${g.list.length === 1 ? '' : 's'}</div></div><span class="d">${icon('back').replace('class="i"', 'class="i" style="transform:rotate(180deg);width:18px"')}</span></div>`; }).join('');
      S.viewList = [];
    } else if (tab === 'playlists') {
      h = `<div class="lh"><h2>Playlists</h2><button class="btn pri" data-act="newpl">${icon('plus')}New</button></div>`;
      const favList = [...S.favs].map(id => S.tracks.get(id)).filter(Boolean);
      h += `<div class="row" style="grid-template-columns:48px 1fr auto" data-act="tab" data-tab="favorites" tabindex="0" role="button"><div class="art" style="background:var(--acc);color:var(--accfg)">${icon('heart')}</div><div class="m"><div class="t">Favorites</div><div class="a">${favList.length} song${favList.length === 1 ? '' : 's'}</div></div><span></span></div>`;
      h += S.playlists.map(p => { const ids = p.ids.filter(id => S.tracks.has(id)); const a = ids.map(id => S.tracks.get(id)).find(t => t.art); return `<div class="row" style="grid-template-columns:48px 1fr auto" data-act="open" data-type="playlist" data-key="${esc(p.id)}" tabindex="0" role="button">${a ? artHTML(a.id) : `<div class="art">${icon('list')}</div>`}<div class="m"><div class="t">${esc(p.name)}</div><div class="a">${ids.length} song${ids.length === 1 ? '' : 's'}</div></div><span></span></div>`; }).join('');
      if (!S.playlists.length) h += emptyMsg('No playlists yet', 'Create one, then add songs from any song’s ⋮ menu.');
      S.viewList = [];
    } else if (tab === 'favorites') {
      const list = [...S.favs].map(id => S.tracks.get(id)).filter(Boolean);
      h = headHTML('Favorites', subOf(list), list) + (list.length ? listHTML(list) : emptyMsg('No favorites yet', 'Tap the heart on the player to save songs here.')); S.ctxLabel = 'Favorites';
    }
  }
  view.innerHTML = h; hydrateArt(view); view.scrollTop = keepScroll;
  view.classList.toggle('paused', audio.paused);
}
function markPlaying() {
  if (S.view.tab === 'home' && !S.view.detail && !S.q.trim() && ((view.querySelector('.cont') || {}).dataset || {}).cur !== (S.cur || undefined)) refreshHome();
  view.querySelectorAll('.row[data-id]').forEach(r => { const t = S.tracks.get(r.dataset.id); r.classList.toggle('on', r.dataset.id === S.cur); r.classList.toggle('bad', !!(t && t.bad)); });
  view.classList.toggle('paused', audio.paused);
}

/* now-playing UI */
async function updateNow() {
  const t = curTrack();
  $('#mini').classList.toggle('show', !!t);
  $('#miniT').textContent = t ? t.title : ''; $('#miniA').textContent = t ? (t.artist || 'Unknown artist') : '';
  $('#npT').textContent = t ? t.title : 'Not playing'; $('#npA').textContent = t ? [t.artist || 'Unknown artist', t.album].filter(Boolean).join(' — ') : '';
  $('#npCtx').textContent = S.ctxName ? `Playing from ${S.ctxName}` : 'Now playing';
  document.title = t ? `${t.title}${t.artist ? ' · ' + t.artist : ''} — muSync` : 'muSync';
  updateFav();
  const id = S.cur; const url = id ? await fullArtUrl(id) : null; if (id !== S.cur) return;
  const set = (box, ph) => { box.innerHTML = ph; if (!url) return; const img = new Image(); img.alt = ''; img.crossOrigin = 'anonymous'; img.onload = () => { if (S.cur === id) { box.innerHTML = ''; box.append(img); } }; img.src = url; };
  set($('#npArt'), '<div class="np-logo"></div>'); set($('#miniArt'), icon('note', 'i ph'));
  $('#npBg').style.backgroundImage = url ? `url("${url}")` : 'none';
  setMediaMeta(t, url);
  updateProgress(true);
}
function updateFav() { const on = !!(S.cur && S.favs.has(S.cur)); const b = $('#npFav'); b.classList.toggle('on', on); b.innerHTML = icon(on ? 'heart' : 'heart-o'); b.setAttribute('aria-label', on ? 'Remove from favorites' : 'Add to favorites'); b.setAttribute('aria-pressed', String(on)); }
let homeT = 0;
function refreshHome() { clearTimeout(homeT); homeT = setTimeout(() => { if (S.view.tab === 'home' && !S.view.detail && !S.q.trim() && !layers.some(l => l.name === 'sheet')) render(); }, 400); }
function updatePlayState() {
  const playing = !audio.paused && !audio.ended;
  const cb = view.querySelector('.cont .pbtn'); if (cb) { cb.innerHTML = icon(playing ? 'pause' : 'play'); cb.setAttribute('aria-label', playing ? 'Pause' : 'Play'); const sm = view.querySelector('.cont small'); if (sm) sm.textContent = playing ? 'Now playing' : 'Continue listening'; }
  for (const sel of ['#playBtn', '#miniPlay']) { const b = $(sel); b.innerHTML = icon(playing ? 'pause' : 'play'); b.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
  view.classList.toggle('paused', !playing);
  if (MS) try { MS.playbackState = S.cur ? (playing ? 'playing' : 'paused') : 'none'; } catch {}
}
let seeking = false;
function updateProgress(force) {
  const d = audio.duration, c = audio.currentTime;
  const pct = isFinite(d) && d > 0 ? c / d : 0;
  $('#miniPb').style.width = (pct * 100).toFixed(2) + '%';
  if (!seeking || force) { const r = $('#seek'); if (!seeking) { r.value = Math.round(pct * 1000); r.style.setProperty('--p', (pct * 100) + '%'); $('#tCur').textContent = fmt(c); } }
  $('#tDur').textContent = fmt(isFinite(d) ? d : (curTrack()?.duration || 0));
}
function updateModes() {

/* ================= Visualizer ================= */
const viz = $('#viz'); let vizRaf = 0;
function vizLoop() {
  if (vizRaf || !S.set.viz) return;
  const ctx = viz.getContext('2d'); let data = null, last = 0; const lv = new Float32Array(40);
  const color = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#7088ff';
  const draw = ts => {
    if (audio.paused || document.hidden || !$('#np').classList.contains('show') || !S.set.viz) { vizRaf = 0; ctx.clearRect(0, 0, viz.width, viz.height); return; }
    vizRaf = requestAnimationFrame(draw);
    if (ts - last < 33) return; last = ts; // ~30 fps keeps the page light
    const dpr = Math.min(2, devicePixelRatio || 1), w = viz.clientWidth, h = viz.clientHeight;
    if (viz.width !== Math.round(w * dpr)) { viz.width = Math.round(w * dpr); viz.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const bars = lv.length, bw = w / bars;
    if (A.live && !audio.native) {
      if (!data) data = new Uint8Array(A.n.an.frequencyBinCount);
      A.n.an.getByteFrequencyData(data);
      for (let i = 0; i < bars; i++) lv[i] = data[Math.floor(Math.pow(i / bars, 1.6) * (data.length * .85))] / 255;
    } else {
      const t = ts / 1000; // decorative pulse when the spectrum isn't available
      for (let i = 0; i < bars; i++) lv[i] = lv[i] * .7 + .3 * (.25 + .35 * Math.abs(Math.sin(t * 2.1 + i * .55)) * (.6 + .4 * Math.sin(t * .9 + i * .21)));
    }
    ctx.fillStyle = color; ctx.globalAlpha = .7;
    for (let i = 0; i < bars; i++) { const bh = Math.max(2, lv[i] * h); ctx.fillRect(i * bw + 1, h - bh, Math.max(1, bw - 2), bh); }
  };
  vizRaf = requestAnimationFrame(draw);
}

function sleepMenu() {

}

/* ================= Settings ================= */
async function openSettings() {

  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); usage = `${((e.usage || 0) / 1048576).toFixed(0)} MB used${e.quota ? ` of ${(e.quota / 1073741824).toFixed(1)} GB available` : ''}`; } } catch {}
